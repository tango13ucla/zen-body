<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="体律" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" /></noscript>
<title>体律</title>
<style>
  :root {
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.17);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-solid: #2D7A56;
    --moss-soft: rgba(43, 95, 73, 0.09);
    --moss-border: rgba(43, 95, 73, 0.28);
    --ochre: #A87633;
    --bengara: #9E3E36;
    --bengara-soft: rgba(158, 62, 54, 0.10);
    --cta-bg: #252420;
    --cta-fg: #F7F5EF;
    --cta-border: transparent;
    --soft-bg: rgba(28, 27, 24, 0.045);
    --tap-bg: rgba(28, 27, 24, 0.06);
    --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --sans-jp: "Noto Sans JP", "Hiragino Sans", "Noto Sans SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --washi: #171614;
      --sheet: #201F1C;
      --sumi: #EAE5DA;
      --ink-2: #B9B2A5;
      --ink-3: #868074;
      --hairline: rgba(234, 229, 218, 0.09);
      --hairline-strong: rgba(234, 229, 218, 0.18);
      --track: #2F2D28;
      --moss: #62AD89;
      --moss-solid: #3F8B66;
      --moss-soft: rgba(98, 173, 137, 0.14);
      --moss-border: rgba(98, 173, 137, 0.34);
      --ochre: #D2A35C;
      --bengara: #D46F66;
      --bengara-soft: rgba(212, 111, 102, 0.14);
      --cta-bg: #2A2824;
      --cta-fg: #F2EDE3;
      --cta-border: rgba(234, 229, 218, 0.22);
      --soft-bg: rgba(234, 229, 218, 0.055);
      --tap-bg: rgba(234, 229, 218, 0.08);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; overscroll-behavior: none;
    background: var(--washi); color: var(--sumi); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 24px calc(12px + env(safe-area-inset-bottom) + var(--kb-pad, 0px));
  }
  .zen-shell {
    width: 100%; max-width: 496px; flex: 1; min-height: 0;
    display: flex; flex-direction: column; position: relative;
  }
  button, a {
    font-family: inherit; white-space: nowrap; background: none; border: none;
    padding: 0; color: inherit; cursor: pointer; text-decoration: none;
    touch-action: manipulation;
  }
  button.is-pressed { transform: scale(0.975); opacity: 0.84; transition: transform 0.06s ease-out, opacity 0.06s ease-out !important; }
  input { font-family: inherit; -webkit-user-select: text; user-select: text; }
  .zen-horizon {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 10px; border-bottom: 1px solid var(--hairline);
  }
  .enso-trio { display: flex; align-items: center; gap: 11px; }
  .enso-item { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; }
  .enso-svg { width: 24px; height: 24px; display: block; overflow: visible; }
  .horizon-metric {
    font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; padding: 4px 0;
  }
  .horizon-metric b { color: var(--sumi); font-weight: 600; }
  .dock-row { display: flex; gap: 10px; margin-top: 14px; }
  .sumi-btn {
    flex: 1; height: 48px; border-radius: 12px; background: var(--cta-bg); color: var(--cta-fg);
    border: 1px solid var(--cta-border); font-size: 15px; font-weight: 500; letter-spacing: 0.06em;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sumi-btn:active { opacity: 0.86; transform: scale(0.988); }

  /* Desktop top subnav vs Mobile bottom thumb nav (上看下点) */
  .thumb-nav {
    flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end;
    padding: 10px 0 2px; border-top: 1px solid var(--hairline);
  }
  .thumb-tabs { display: flex; align-items: center; gap: 26px; position: relative; }
  .thumb-tab {
    font-size: 14.5px; font-weight: 500; color: var(--ink-3);
    padding: 6px 2px; min-height: 36px; letter-spacing: 0.05em;
    transition: color 0.18s ease;
  }
  .thumb-tab.active { color: var(--sumi); font-weight: 600; }
  .thumb-bar {
    position: absolute; left: 0; top: -11px; height: 1.5px; width: 28px;
    background: var(--sumi); border-radius: 2px; pointer-events: none; will-change: transform, width;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (max-width: 859px) {
    .zb-subnav { display: none !important; }
    .zb-date-mob { display: block; }
  }
  @media (min-width: 860px) {
    .thumb-nav { display: none !important; }
    .zb-date-mob { display: none; }
  }
  .zb-date-mob {
    flex-shrink: 0; padding: 10px 0 0; font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; letter-spacing: 0.03em; text-align: right;
  }

/* ================= 6. PROGRESS & CROSS-DEVICE SYNC MODAL ================= */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(28, 27, 24, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.22s;
  }
  @media (prefers-color-scheme: dark) {
    .modal-mask { background: rgba(10, 9, 8, 0.66); }
  }
  @media (max-width: 859px), (max-height: 520px) {
    .modal-mask {
      align-items: flex-end;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }
  }
  .modal-mask.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0s;
  }
  .modal-mask.sheet-dragging { transition: none; }
  .modal-card {
    width: 100%;
    max-width: 396px;
    max-height: 82vh;
    max-height: 82dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--sheet);
    border: 1px solid var(--hairline-strong);
    border-radius: 16px;
    padding: 24px 22px;
    position: relative;
    will-change: transform, opacity;
    transform: translate3d(0, 14px, 0) scale(0.985);
    opacity: 0;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  @media (max-width: 859px), (max-height: 520px) {
    .modal-card {
      padding-top: 26px;
      transform: translate3d(0, 100%, 0);
      opacity: 1;
    }
    .modal-card::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--hairline-strong);
      opacity: 0.72;
      pointer-events: none;
    }
  }
  .modal-mask.open .modal-card {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 1;
  }
  .modal-card.sheet-dragging { transition: none !important; }
  .modal-card::-webkit-scrollbar { display: none; }
  .modal-h { margin: 0 0 12px; font-size: 18px; font-weight: 500; letter-spacing: 0.05em; }
  .modal-body { margin: 0 0 14px; font-size: 15.5px; color: var(--ink-2); line-height: 1.85; font-variant-numeric: tabular-nums; }
  .modal-promise { margin: 0 0 16px; padding-top: 12px; border-top: 1px solid var(--hairline); font-size: 14.5px; color: var(--moss); line-height: 1.65; font-weight: 400; }
  .install-app-row {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--soft-bg);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .install-app-copy { min-width: 0; flex: 1; }
  .install-app-title { font-size: 14px; font-weight: 500; color: var(--sumi); letter-spacing: 0.02em; }
  .install-app-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; white-space: normal; }
  .install-app-btn {
    flex-shrink: 0;
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--moss-soft);
    border: 1px solid var(--moss-border);
    color: var(--moss);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.03em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .install-app-hint {
    margin: -8px 0 14px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.55;
    padding: 0 4px;
  }
  .sync-box {
    margin: 0 0 18px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--soft-bg);
    border: 1px solid var(--hairline);
  }
  .sync-note {
    margin: 0 0 10px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .sync-btn {
    width: 100%;
    height: 44px;
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    background: var(--sheet);
    font-size: 14px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.04em;
  }
  .sync-btn.copied {
    border-color: var(--moss);
    color: var(--moss);
  }

  
/* ================= 6. NATIVE ZEN BODY MODULE ("体律" · Open-Washi Zen Ma & Kanso) ================= */
  #green-board.hidden, #body-view.hidden, .zen-panel.hidden { display: none !important; }
  #body-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .zb-subnav {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0 9px;
    border-bottom: 1px solid var(--hairline);
    gap: 8px;
  }
  .zb-subtabs { display: flex; align-items: center; gap: 22px; position: relative; }
  .zb-sub-bar {
    position: absolute;
    left: 0;
    bottom: -10px;
    height: 1.5px;
    width: 28px;
    background: var(--sumi);
    border-radius: 2px;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .zb-subtab {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 6px 0;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    position: relative;
    letter-spacing: 0.05em;
    transition: color 0.18s ease;
  }
  .zb-subtab.active { color: var(--sumi); font-weight: 600; }
  .zb-date-tag { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }

  .zb-ptr {
    flex-shrink: 0;
    height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    opacity: 0;
    transition: height 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .zb-ptr.dragging { transition: none; }
  .zb-ptr-svg { width: 18px; height: 18px; display: block; }
  .zb-ptr.syncing .zb-ptr-svg { animation: zbSpin 0.85s linear infinite; }
  @keyframes zbSpin { to { transform: rotate(360deg); } }
  .zb-ptr-lbl { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }

  .zb-stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    padding: 0 0 10px;
  }
  .zb-stage::-webkit-scrollbar { display: none; }
  .zb-panel { display: none; flex-direction: column; flex: 1; min-height: 100%; contain: layout style; will-change: transform, opacity; }
  .zb-panel.active { display: flex; }
  .zb-panel.zb-slide-r { animation: zbSlideR 0.23s cubic-bezier(0.22, 1, 0.36, 1); }
  .zb-panel.zb-slide-l { animation: zbSlideL 0.23s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes zbSlideR { from { opacity: 0.28; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes zbSlideL { from { opacity: 0.28; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }

  /* Generous Zen Ma (余白) floating the single focal decision cleanly into the right-thumb arc */
  .zb-ma { flex: 1 1 36px; min-height: 20px; max-height: 92px; }
  .zb-ma-tail { flex: 0.45 1 14px; min-height: 8px; }

  .zb-context {
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-variant-numeric: tabular-nums;
  }
  .zb-state-trigger {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px 6px 0;
    min-height: 36px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: opacity 0.16s ease, color 0.16s ease;
    min-width: 0;
  }
  .zb-state-trigger:active { opacity: 0.62; }
  .zb-state-trigger.is-static { pointer-events: none; }
  .zb-state-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--moss);
    transition: background-color 0.2s ease;
  }
  .zb-state-dot.yellow { background: var(--ochre); }
  .zb-state-dot.red { background: var(--bengara); }
  .zb-state-lbl {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zb-state-chev {
    flex-shrink: 0;
    color: var(--ink-3);
    opacity: 0.65;
    margin-left: -1px;
    transition: transform 0.18s ease;
  }

  .zb-pz-btn {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    padding: 6px 0 6px 8px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 0.16s ease;
  }
  .zb-pz-btn:active { color: var(--sumi); }
  .zb-pz-btn.warn { color: var(--ochre); }
  .zb-pz-btn.urgent { color: var(--bengara); }

  .zb-hero-tap {
    cursor: pointer;
    padding: 2px 0;
    transition: opacity 0.16s ease;
  }
  .zb-hero-tap:active { opacity: 0.72; }
  .zb-title {
    font-family: var(--sans);
    font-size: clamp(24px, 6.4vw, 28px);
    font-weight: 400;
    line-height: 1.38;
    letter-spacing: 0.03em;
    color: var(--sumi);
    margin: 12px 0 9px;
    text-wrap: balance;
  }
  .zb-sub,
  .zb-guide-txt {
    margin: 0;
    font-size: 14px;
    line-height: 1.64;
    color: var(--ink-2);
    letter-spacing: 0.015em;
    text-wrap: pretty;
  }

  .zb-cta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
  }
  .zb-btn-primary {
    flex: 1;
    height: 52px;
    padding: 0 20px;
    border-radius: 12px;
    background: var(--cta-bg);
    color: var(--cta-fg);
    border: 1px solid var(--cta-border);
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: 0.07em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity 0.15s ease, transform 0.12s ease, background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease;
  }
  .zb-btn-primary.is-done {
    background: var(--moss-soft);
    border-color: var(--moss-border);
    color: var(--moss);
    font-weight: 500;
  }
  .zb-btn-primary:active { transform: scale(0.985); opacity: 0.86; }
  .zb-btn-ghost {
    height: 52px;
    padding: 0 16px;
    border: 1px solid var(--hairline-strong);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: 0.04em;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .zb-btn-ghost:active { background: var(--tap-bg); }

  .zb-btn-quiet {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 8px 2px;
    letter-spacing: 0.03em;
    display: inline-flex;
    align-items: center;
    transition: color 0.18s ease, opacity 0.18s ease;
  }
  .zb-btn-quiet:active { color: var(--sumi); }
  .zb-btn-quiet.active { color: var(--moss); font-weight: 600; }
  .zb-btn-quiet.is-ochre { color: var(--ochre); font-weight: 600; }
  .zb-btn-quiet.is-red { color: var(--bengara); font-weight: 600; }

  .zb-aux-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 8px;
    min-height: 34px;
  }
  .zb-aux-grp {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
  }
  .zb-week-quiet {
    font-size: 12.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .zb-ritual-list { margin-top: 26px; border-top: 1px solid var(--hairline); }
  .zb-ritual-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 62px;
    padding: 12px 0;
    border-bottom: 1px solid var(--hairline);
    gap: 14px;
  }
  .zb-ritual-left {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    text-align: left;
    padding: 2px 0;
    transition: opacity 0.16s ease;
  }
  .zb-ritual-left:active { opacity: 0.65; }
  .zb-ritual-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--sumi);
    letter-spacing: 0.025em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .zb-ritual-chev {
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-3);
    opacity: 0.55;
    line-height: 1;
  }
  .zb-ritual-hint {
    font-size: 12.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    line-height: 1.38;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .zb-ritual-right { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .zb-round-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.3px solid var(--hairline-strong);
    color: var(--ink-3);
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.14s ease;
  }
  .zb-round-dot:active { transform: scale(0.92); }

<script>
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isCloudSyncBlockedEnv(locObj, navObj) {
  try {
    const loc = locObj || (typeof location !== "undefined" ? location : null);
    const nav = navObj || (typeof navigator !== "undefined" ? navigator : null);
    if (!loc) return true;
    const host = String(loc.hostname || "").toLowerCase();
    const proto = String(loc.protocol || "").toLowerCase();
    const search = String(loc.search || "").toLowerCase();
    if (proto === "file:" || host === "localhost" || host === "127.0.0.1" || host === "::1" || host === "[::1]" || host.endsWith(".local")) return true;
    if (search.includes("qa=1") || search.includes("nosync=1") || search.includes("preview=1")) return true;
    if (nav) {
      if (nav.webdriver === true) return true;
      const ua = String(nav.userAgent || "");
      if (/HeadlessChrome|Playwright|Puppeteer|PhantomJS/i.test(ua)) return true;
    }
  } catch (e) {}
  return false;
}
const CLOUD_SYNC_BLOCKED = isCloudSyncBlockedEnv();

let deferredInstallPrompt = null;
function isStandaloneApp() {
  try {
    if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    if (window.navigator && window.navigator.standalone === true) return true;
  } catch (e) {}
  return false;
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  const row = document.getElementById("install-app-row");
  if (row) row.style.display = "none";
});
async function triggerPwaInstall() {
  const hint = document.getElementById("install-app-hint");
  if (deferredInstallPrompt && typeof deferredInstallPrompt.prompt === "function") {
    try {
      deferredInstallPrompt.prompt();
      const res = await deferredInstallPrompt.userChoice;
      if (res && res.outcome === "accepted") {
        deferredInstallPrompt = null;
        const row = document.getElementById("install-app-row");
        if (row) row.style.display = "none";
        if (hint) hint.style.display = "none";
        return;
      }
    } catch (e) {}
  }
  if (hint) {
    hint.textContent = "请点浏览器右上角「⋮」菜单，再点「安装应用」或「添加到主屏幕」，即可全屏启动。";
    hint.style.display = "block";
  }
}

try {
  if (navigator.storage && typeof navigator.storage.persist === "function") {
    navigator.storage.persist().catch(() => {});
  }
} catch (e) {}

(function bindNativePressFeedback() {
  let activeEl = null, sx = 0, sy = 0;
  const clear = () => {
    if (activeEl) { activeEl.classList.remove("is-pressed"); activeEl = null; }
  };
  document.addEventListener("pointerdown", e => {
    if (e.button && e.button !== 0) return;
    const btn = e.target && e.target.closest ? e.target.closest("button") : null;
    if (!btn || btn.disabled) return;
    clear();
    activeEl = btn;
    sx = e.clientX || 0; sy = e.clientY || 0;
    btn.classList.add("is-pressed");
  }, { passive: true });
  document.addEventListener("pointermove", e => {
    if (!activeEl) return;
    if (Math.hypot((e.clientX || 0) - sx, (e.clientY || 0) - sy) > 10) clear();
  }, { passive: true });
  document.addEventListener("pointerup", clear, { passive: true });
  document.addEventListener("pointercancel", clear, { passive: true });
  window.addEventListener("blur", clear, { passive: true });
})();

(function bindVisualViewportInset() {
  const vv = window.visualViewport;
  if (!vv || !vv.addEventListener) return;
  const syncKb = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)));
    document.documentElement.style.setProperty("--kb-pad", kb > 80 ? `${kb}px` : "0px");
  };
  vv.addEventListener("resize", syncKb, { passive: true });
  vv.addEventListener("scroll", syncKb, { passive: true });
})();

const NAV_LAYER_STACK = [];
let handlingPopstate = false;
function pushNavLayer(kind) {
  if (handlingPopstate || !window.history || typeof history.pushState !== "function") return;
  if (NAV_LAYER_STACK[NAV_LAYER_STACK.length - 1] === kind) return;
  NAV_LAYER_STACK.push(kind);
  try { history.pushState({ zbLayer: kind, idx: NAV_LAYER_STACK.length }, ""); } catch (e) {}
}
function popNavLayer(kind) {
  if (handlingPopstate) return;
  const idx = NAV_LAYER_STACK.lastIndexOf(kind);
  if (idx < 0) return;
  NAV_LAYER_STACK.splice(idx, 1);
  if (idx === NAV_LAYER_STACK.length && window.history && typeof history.back === "function") {
    try {
      if (history.state && history.state.zbLayer === kind) {
        handlingPopstate = true;
        history.back();
        setTimeout(() => { handlingPopstate = false; }, 120);
      }
    } catch (e) { handlingPopstate = false; }
  }
}
window.addEventListener("popstate", () => {
  if (handlingPopstate || !NAV_LAYER_STACK.length) return;
  handlingPopstate = true;
  const top = NAV_LAYER_STACK.pop();
  try {
    if (top === "modal") closeModal(true);
  } catch (e) {}
  handlingPopstate = false;
});

function showAppModal() {
  const mm = document.getElementById("app-modal");
  const mc = document.getElementById("modal-content");
  if (!mm) return;
  if (mc) {
    mc.classList.remove("sheet-dragging");
    mc.style.transform = "";
  }
  mm.classList.remove("sheet-dragging");
  mm.style.opacity = "";
  const alreadyOpen = mm.classList.contains("open");
  mm.classList.add("open");
  if (!alreadyOpen) pushNavLayer("modal");
  if (mc) {
    const resetScroll = () => { try { mc.scrollTop = 0; } catch (e) {} };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(resetScroll);
    else resetScroll();
  }
}

function closeModal(fromPop) {
  const mm = document.getElementById("app-modal");
  const mc = document.getElementById("modal-content");
  if (mc) {
    mc.classList.remove("sheet-dragging");
    mc.style.transform = "";
  }
  if (mm) {
    const wasOpen = mm.classList.contains("open");
    mm.classList.remove("sheet-dragging", "open");
    mm.style.opacity = "";
    if (wasOpen && !fromPop) popNavLayer("modal");
  }
}

(function bindBottomSheetDragDismiss() {
  const mm = document.getElementById("app-modal");
  const mc = document.getElementById("modal-content");
  if (!mm || !mc || !mc.addEventListener) return;
  let dragging = false, sy = 0, dy = 0, st = 0, rafId = 0;
  const applyDragFrame = () => {
    rafId = 0;
    if (!dragging) return;
    const visualY = dy < 0 ? (-Math.pow(-dy, 0.72) * 0.34) : dy;
    mc.style.transform = `translate3d(0, ${visualY.toFixed(1)}px, 0)`;
    mm.style.opacity = (dy > 0 ? Math.max(0.08, 1 - dy / 340) : 1).toFixed(3);
  };
  mc.addEventListener("touchstart", e => {
    if (!mm.classList.contains("open") || !e.touches || e.touches.length !== 1) return;
    if (window.innerWidth > 859 && window.innerHeight > 520) return;
    if ((mc.scrollTop || 0) > 2) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    sy = e.touches[0].clientY; dy = 0; st = performance.now(); dragging = false;
  }, { passive: true });
  mc.addEventListener("touchmove", e => {
    if (!mm.classList.contains("open") || !e.touches || e.touches.length !== 1) return;
    if (window.innerWidth > 859 && window.innerHeight > 520) return;
    const curDy = e.touches[0].clientY - sy;
    if (!dragging) {
      if ((mc.scrollTop || 0) > 2 || curDy < 10) return;
      dragging = true;
      mc.classList.add("sheet-dragging");
      mm.classList.add("sheet-dragging");
    }
    if (dragging) {
      if (e.cancelable) e.preventDefault();
      dy = curDy;
      if (!rafId && typeof requestAnimationFrame === "function") rafId = requestAnimationFrame(applyDragFrame);
      else if (typeof requestAnimationFrame !== "function") applyDragFrame();
    }
  }, { passive: false });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (rafId && typeof cancelAnimationFrame === "function") { cancelAnimationFrame(rafId); rafId = 0; }
    const dt = Math.max(1, performance.now() - st);
    const vy = dy / dt;
    const shouldClose = dy > 84 || (dy > 34 && vy > 0.45);
    mc.classList.remove("sheet-dragging");
    mm.classList.remove("sheet-dragging");
    mm.style.opacity = "";
    if (shouldClose) {
      const dur = Math.max(145, Math.min(240, Math.round(230 - vy * 55)));
      mc.style.transitionDuration = `${dur}ms`;
      mc.style.transform = "";
      closeModal();
      setTimeout(() => { mc.style.transitionDuration = ""; }, dur + 30);
    } else {
      mc.style.transform = "";
    }
    dy = 0;
  };
  mc.addEventListener("touchend", endDrag, { passive: true });
  mc.addEventListener("touchcancel", endDrag, { passive: true });
})();

    // 1. Travel mode (short trip <=5d: pure chill walking; long trip >5d: walking + optional 8m hotel bodyweight maintenance)

    // 5. Explicit Rest Day (Always calm green, zero scolding, zero forced pull-ups!)
    if (st.mode === "rest") {
      const restDone = !!(pelo && pelo.status === "rest");
      return {
        tier: "green",
        tierText: "休息日",
        title: "今日正式休息，不上车",

    if (!forcePZ) {

  function puCooldown(day, target) {
    const rs = (day && day.pu) || [];
    const tgt = Math.max(1, target || 2);
    if (rs.length >= 1 && rs.length < tgt) {
      const lastTs = rs[rs.length - 1] && rs[rs.length - 1][2];
      const nextN = rs.length + 1;
      if (lastTs) {
        const t1 = fmtEpochPT(lastTs), t2 = fmtEpochPT(lastTs + 7200);
        return (Math.floor(Date.now() / 1000) < lastTs + 7200)
          ? `第 ${rs.length} 轮 ${t1} 已拉 · ${t2} 后第 ${nextN} 轮`
          : `第 ${rs.length} 轮 ${t1} 已拉 · 可拉第 ${nextN} 轮`;
      }
      return `第 ${rs.length} 轮已拉 · 隔 2 小时第 ${nextN} 轮`;
    }
    if (rs.length >= tgt) {
      const tsEnd = rs[rs.length - 1] && rs[rs.length - 1][2];
      return tsEnd ? `今日 ${rs.length} 轮已于 ${fmtEpochPT(tsEnd)} 收工` : `今日 ${rs.length} 轮已收工`;
    }
    return "";

  function latestWB() {

    const wts = arr.filter(r => r[1]).slice(-5);
    const avgWt = wts.length ? +(wts.reduce((s, r) => s + r[1], 0) / wts.length).toFixed(1) : null;
    const bfs = arr.filter(r => r[2] && r[2] > 5);
    let avgBf = null;
    if (bfs.length) {
      const lastT = Date.parse(bfs[bfs.length - 1][0] + "T12:00:00Z");
      const win = [];
      for (let i = bfs.length - 1; i >= 0; i--) {
        const dt = (lastT - Date.parse(bfs[i][0] + "T12:00:00Z")) / 86400000;
        if (dt <= 14 || win.length < 2) win.push(bfs[i][2]);

      const applyGestureFrame = () => {

        } else if (mode === "ptr" && ldy > 0) {
          const pull = Math.min(56, ldy * 0.48), pct = Math.min(100, Math.round((pull / 46) * 100));
          if (ptr) { ptr.style.height = `${pull.toFixed(0)}px`; ptr.style.opacity = `${Math.min(1, pull / 30).toFixed(2)}`; }
          if (ptrArc) ptrArc.setAttribute("stroke-dasharray", `${pct} 100`);

      stage.addEventListener("touchstart", e => {

      }, { passive: true });
      stage.addEventListener("touchmove", e => {
        if (!trk || !e.touches || e.touches.length !== 1) return;

          else if (typeof requestAnimationFrame !== "function") applyGestureFrame();

          const dt = Date.now() - t0, idx = SUB_ORDER.indexOf(SUBTAB);

    // Interactive Body Chart Scrubbing (120Hz rAF + zero-layout cached SVG rect)

        const sx = Math.max(0, Math.min(360, ratio * 360));
        let bi = 0, bd = Infinity;

      });
      cw.addEventListener("pointermove", e => { if (!scOn && (e.pointerType !== "mouse" || e.buttons === 0)) return; scheduleScrub(e.clientX, e.clientY); });
      cw.addEventListener("pointerup", endS);
      cw.addEventListener("pointercancel", endS);

  function parseVaultLink(str) {
    if (!str) return null;
    const idx = str.indexOf("#");

    const p = new URLSearchParams(raw);
    const t = p.get("t") || p.get("bt");
    const k = p.get("k") || p.get("bk");
    if (t && k && t.length >= 16 && k.length >= 40) return { t, k };
    return null;

  async function saveVaultCache(v) {

  async function tryRestoreVault() {
    try {
      const fromH = parseVaultLink(location.hash || "");
      if (fromH) {
        VAULT = fromH;
        await saveVaultCache(VAULT);
      }
    } catch (e) {}
    if (!VAULT) {
      for (const keyName of [VAULT_KEY, "zen_body_vault_v1"]) {
        try {
          const s = localStorage.getItem(keyName);
          if (s) { const o = JSON.parse(s); if (o && o.t && o.k) { VAULT = o; break; } }
        } catch (e) {}
      }
    }
    if (!VAULT) {
      try {
        if (typeof caches !== "undefined" && caches.open) {
          const c = await caches.open("zen-body-vault-cache-v1");

          if (resp) { const o = await resp.json(); if (o && o.t && o.k) VAULT = o; }
        }

  async function unlockPass() {
    const inp = ge("zb-pass-in"), err = ge("zb-lock-err"), btn = ge("zb-unlock-btn");
    const rawIn = (inp && inp.value || "").trim();
    const parsedLink = parseVaultLink(rawIn);
    if (parsedLink) {
      VAULT = parsedLink;
      CKEY = await importRawKey(VAULT.k);
      if (CKEY) {
        await saveVaultCache(VAULT);
        try { location.hash = `t=${encodeURIComponent(VAULT.t)}&k=${encodeURIComponent(VAULT.k)}`; } catch (e) {}

        await pullCloud(true);
        toast("已解锁并记住本设备");
        return;
      }
    }
    const pass = rawIn.toLowerCase();
    if (!pass) { if (err) err.textContent = "请先输入口令"; return; }
    if (typeof crypto === "undefined" || !crypto.subtle) { if (err) err.textContent = "请用 HTTPS 打开本页"; return; }
    if (btn) btn.textContent = "解锁中…";
    if (err) err.textContent = "";
    try {
      const r = await fetch("./body_vault.enc?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("fetch");
      const env = await r.json();
      const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      const dKey = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64uToBytes(env.salt), iterations: env.iter || 310000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      const unwrapped = await decWithKey(dKey, env.w);
      if (!unwrapped || !unwrapped.t || !unwrapped.k) {
        if (err) err.textContent = "口令不太对，再试一次";
        if (btn) btn.textContent = "解锁";
        return;
      }
      VAULT = { t: unwrapped.t, k: unwrapped.k };
      CKEY = await importRawKey(VAULT.k);
      try { localStorage.setItem(VAULT_KEY, JSON.stringify(VAULT)); } catch (e) {}
      if (inp) inp.value = "";
      if (btn) btn.textContent = "解锁";

      await applyEncryptedProfile(env);
      render();
      positionSubBar(true);
      await pullCloud(true);
      toast("已解锁并记住本设备");
    } catch (e) {
      if (err) err.textContent = "网络或口令异常，请重试";
      if (btn) btn.textContent = "解锁";
    }
  }

  function openProteinGuide() {
    const wb = latestWB();

    const pMid = Math.round((wt * 1.8) / 5) * 5;
    const pHi = Math.round((wt * 2.0) / 5) * 5;
    const fill = s => String(s || "")
      .replace(/\{wt\}/g, wt.toFixed(1))
      .replace(/\{pLo\}/g, String(pLo))
      .replace(/\{pMid\}/g, String(pMid))
      .replace(/\{pHi\}/g, String(pHi));
    if (PROF && Array.isArray(PROF.diet_items) && PROF.diet_items.length) {
      const pTitle = fill(PROF.diet_title || "每日蛋白锚点 · 目标 {pLo}–{pHi}g");
      const pItems = PROF.diet_items.map(it => ({
        k: fill(it.k), v: fill(it.v), sub: fill(it.sub), cur: !!it.cur
      }));
      showGuideModal(pTitle, pItems);
      return;

    showGuideModal(`每日蛋白锚点 · 目标 ${pLo}–${pHi}g`, [

    ]);

  return {
    onEnter, onResume, unlockPass, stopPacer, getSummary, syncCircle, getHorizonHTML, syncMiniVisibility,
    openPeloGuide, openPZList, openStateSheet, openBandGuide, openProteinGuide, openGapsGuide,
    pickState(mode, sub, keepOpen) {
      this.setState(mode, sub || undefined);
      if (keepOpen) openStateSheet();
      else if (typeof closeModal === "function") closeModal();
    },
    _planToday(opts) { return planFor(todayYmd(), opts); },
    _planOn(ymd, opts) { return planFor(ymd, opts); },
    _puStage() { return puStage(); },
    _getState() { return ST; },
    _setProfileForTest(p) { PROF = p || null; },

      if (SUBTAB !== "body") this.setTab("body");
      else if (typeof openSessionModal === "function") openSessionModal();
    },
    setTab(t, dirHint) {
      if (!SUB_ORDER.includes(t)) return;
      if (t === SUBTAB) { positionSubBar(false); return; }
      if (PACER_ON) stopPacer(false);
      const prev = SUB_ORDER.indexOf(SUBTAB), next = SUB_ORDER.indexOf(t);
      const dir = dirHint || (next > prev ? 1 : -1);
      SUBTAB = t;
      document.querySelectorAll(".zb-subtab, .thumb-tab").forEach(b => b.classList.toggle("active", b.dataset.zbt === t)); if (typeof positionThumbNavBar === "function") positionThumbNavBar(false);
      SUB_ORDER.forEach(k => {
        const el = ge("zb-p-" + k);
        if (!el) return;
        el.classList.remove("zb-slide-r", "zb-slide-l");
        el.style.transform = ""; el.style.transition = "";
        el.classList.toggle("active", k === t);
        if (k === t) el.classList.add(dir > 0 ? "zb-slide-r" : "zb-slide-l");
      });
      const st = ge("zb-stage");
      if (st) {
        if (typeof requestAnimationFrame === "function") requestAnimationFrame(() => { st.scrollTop = 0; });
        else st.scrollTop = 0;
      }
      if (t === "body") renderChart();
      positionSubBar(false);
    },
    setState(mode, sub) {
      const today = todayYmd(), d = ensureDay(today);
      const hasDriveBB = actsOn(today).some(a => a[1] === "bb");
      d.force_pz = 0;
      if (mode === "normal") {
        d.bb = hasDriveBB ? "none" : null;
        d.tired = 0;
        d.rest_day = 0;
      } else if (mode === "bb") {
        d.tired = 0;
        d.rest_day = 0;
        if (sub === "light" || sub === "high" || sub === "max") d.bb = sub;
        else if (d.bb !== "light" && d.bb !== "high" && d.bb !== "max") {
          const autoB = hasDriveBB ? bbOn(today) : null;
          d.bb = (autoB && autoB.level) ? autoB.level : "high";
        }
      } else if (mode === "tired") {
        d.bb = hasDriveBB ? "none" : null;
        d.rest_day = 0;
        d.tired = (sub === "sore" || sub === "sleep") ? sub : (d.tired === "sore" ? "sore" : "sleep");
      } else if (mode === "rest") {
        d.bb = hasDriveBB ? "none" : null;
        d.tired = 0;
        d.rest_day = 1;
      }
      schedPush(); render();
    },
    setPZIdx(idx) {
      const n = Math.max(0, Math.min(PZ_LIST.length, Number(idx) || 0));
      const nowS = Math.floor(Date.now() / 1000);
      ST.pz = { idx: n, ts: nowS, last: (ST.pz && ST.pz.last) || "" };
      if (typeof closeModal === "function") closeModal();
      const m = getPZMeta(n);
      toast(m.allDone ? "已标记两套主线全部通关" : `已校准：下节 ${m.progShort} ${m.code}`);
      schedPush(); render();
    },
    overrideToPZ() {
      const today = todayYmd(), d = ensureDay(today);
      const hasDriveBB = actsOn(today).some(a => a[1] === "bb");
      d.force_pz = 1;
      d.tired = 0;
      d.rest_day = 0;
      if (d.bb && d.bb !== "none") d.bb = hasDriveBB ? "none" : null;
      if (typeof closeModal === "function") closeModal();
      toast("已切到今日 Peloton 主线");
      schedPush(); render();
    },
    logCardio(kind) {
      const today = todayYmd(), p = planFor(today), d = ensureDay(today), nowS = Math.floor(Date.now() / 1000);
      if (kind === "recovery") {
        const altT = (p.altAction && p.altAction.type) || "recovery";
        if (altT === "override_pz") {
          this.overrideToPZ();
          return;
        } else if (altT === "to_travel") {
          const hasDriveBB = actsOn(today).some(a => a[1] === "bb");
          d.force_pz = 0; d.rest_day = 0; d.tired = 0; d.bb = hasDriveBB ? "none" : null;
          toast("已切回旅途步行");
        } else if (altT === "to_rest") {
          d.rest_day = 1; d.tired = 0; d.pelo = "rest"; d.pelo_min = 0;
          toast("好，今天安心休整");
        } else if (altT === "light_ride") {
          const mins = (p.altAction && p.altAction.min) || p.altMin || 15;
          d.pelo = d.pelo === "recovery" ? null : "recovery"; d.pelo_min = d.pelo ? mins : 0;
          toast(d.pelo ? `已记轻骑 ${mins} 分钟` : "已撤销");
        } else {
          d.pelo = d.pelo === "recovery" ? null : "recovery"; d.pelo_min = d.pelo ? 15 : 0;
          toast(d.pelo ? "已记 15 分排酸骑" : "已撤销");
        }
      } else if (p.isTravel) {
        d.pelo = d.pelo ? null : "done"; d.pelo_min = 30;
        toast(d.pelo ? "旅途步行已记" : "已撤销");
      } else if (p.actionType === "pz_main") {
        if (d.pz_done != null && d.pelo === "done") {
          const prevIdx = Number(d.pz_done);
          ST.pz = { idx: Math.max(0, prevIdx), ts: nowS, last: (ST.pz && ST.pz.last === today) ? shiftD(today, -1) : ((ST.pz && ST.pz.last) || "") };
          d.pz_done = null; d.pelo = null; d.pelo_min = 0;
          toast("已撤销本节主线打卡");
        } else {
          const curIdx = getPZIdx(), cls = getPZMeta(curIdx);
          d.pz_done = curIdx; d.pelo = "done"; d.pelo_min = cls.min;
          const nextIdx = Math.min(PZ_LIST.length, curIdx + 1);
          ST.pz = { idx: nextIdx, ts: nowS, last: today };
          if (curIdx === 22) toast("恭喜完成 Discover 全部 23 节！已接力 Boost Your Base");
          else if (curIdx === PZ_LIST.length - 1) toast("恭喜完成全部 47 节 Power Zone 主线！");
          else {

          }
        }
      } else if (p.actionType === "z2_swap") {
        const mins = p.rideMin || 30;
        d.pelo = d.pelo === "done" ? null : "done"; d.pelo_min = d.pelo ? mins : 0;
        toast(d.pelo ? `已记 ${mins} 分 Zone 2 稳态燃脂` : "已撤销");
      } else if (p.actionType === "light_ride") {
        const mins = p.rideMin || 20;
        d.pelo = d.pelo === "recovery" ? null : "recovery"; d.pelo_min = d.pelo ? mins : 0;
        toast(d.pelo ? `已记轻骑 ${mins} 分钟` : "已撤销");
      } else {
        d.pelo = d.pelo === "rest" ? null : "rest"; d.pelo_min = 0;
        toast(d.pelo ? "好，今晚安心休养" : "已撤销");
      }
      schedPush(); render();
    },
    quickPU(n) {
      const d = ensureDay(), stg = puStage(), nowS = Math.floor(Date.now() / 1000);
      const maxR = stg.targetRounds || 2;
      if (!Array.isArray(d.pu)) d.pu = [];
      if (d.pu.length >= n) { d.pu = d.pu.slice(0, n - 1); toast(`已撤销第 ${n} 轮`); }
      else {
        while (d.pu.length < n) d.pu.push([stg.defStrict, stg.neg, nowS]);
        toast(n < maxR ? `第 ${n} 轮已记 · 隔 2 小时再拉第 ${n + 1} 轮` : `第 ${n} 轮已记 · 今日引体收工`);
      }
      schedPush(); render();
    },
    adjStrict(delta) { PU_IN = Math.max(0, Math.min(10, PU_IN + delta)); render(); },
    togglePacer() {
      if (PACER_ON) { stopPacer(true); return; }
      const maxR = puStage().targetRounds || 2;
      if ((dayE(todayYmd()).pu || []).length >= maxR) { toast(`今天 ${maxR} 轮已满额，明天继续`); return; }
      startPacer();
    },
    togglePacerSound() {
      PACER_SND = !PACER_SND;
      const b = ge("zb-pacer-snd");
      if (b) { b.textContent = PACER_SND ? "轻音：开" : "轻音：关"; b.className = "zb-btn-quiet" + (PACER_SND ? " active" : ""); }
      if (PACER_SND) playChime(528);
    },
    logPU() {
      const d = ensureDay(), stg = puStage(), maxR = stg.targetRounds || 2;
      if (!Array.isArray(d.pu)) d.pu = [];
      if (d.pu.length >= maxR) { toast(`今天 ${maxR} 轮已满额，明天继续`); return; }
      const nowS = Math.floor(Date.now() / 1000);
      const negAdd = stg.neg > 0 ? Math.max(0, 3 - PU_IN) : 0;
      d.pu.push([PU_IN, negAdd, nowS]);
      if (PU_IN > (ST.pu_best || 1)) { ST.pu_best = PU_IN; ST.pu_best_ts = nowS; toast(`新纪录！标准不甩 ${PU_IN} 个`); }
      else toast(d.pu.length < maxR ? `第 ${d.pu.length} 轮已记 · 隔 2 小时第 ${d.pu.length + 1} 轮` : `今日 ${maxR} 轮引体收工`);
      schedPush(); render();
    },
    undoPU() {
      const d = ensureDay();
      if (Array.isArray(d.pu) && d.pu.length) { d.pu.pop(); schedPush(); render(); toast("已撤销上一轮"); }
    },
    toggleRes() {
      const d = ensureDay();
      d.res = d.res ? 0 : 1;
      schedPush(); render();
      toast(d.res ? "已记 5 分钟居家护肌（俯卧撑+深蹲）" : "已取消今日护肌记录");
    },
    toggleDiet() {
      const d = ensureDay(); d.diet = d.diet ? 0 : 1;
      schedPush(); render(); toast(d.diet ? "今日饮食节律已打卡" : "已取消");
    },
    setMetric(m) { METRIC = m; render(); },
    setRange(r) { RANGE = r; render(); },
    toggleWForm(force) {
      const f = ge("zb-wform"), b = ge("zb-wbtn");
      if (!f || !b) return;
      const open = typeof force === "boolean" ? force : !f.classList.contains("open");
      if (open) {
        const wb = latestWB();
        D_WT = wb.lwt ? +wb.lwt[1].toFixed(1) : 81.5;
        D_BF = wb.lbf ? +wb.lbf[2].toFixed(1) : 18.0;
        D_SKIP_BF = false;
        const winp = ge("zb-waist-in");
        if (winp) winp.value = "";
        renderDial();
      }
      f.classList.toggle("open", open);
      b.textContent = open ? "收起" : "记一次称重";
    },
    nudgeDial(which, delta) {
      if (which === "wt") { D_WT = Math.max(45, Math.min(120, +(D_WT + delta).toFixed(1))); D_WT_OFF -= delta * 100; }
      else { D_SKIP_BF = false; D_BF = Math.max(6, Math.min(40, +(D_BF + delta).toFixed(1))); D_BF_OFF -= delta * 100; }
      renderDial();
    },
    toggleSkipBf() { D_SKIP_BF = !D_SKIP_BF; renderDial(); },
    editDial(which) {
      const slot = ge(which === "wt" ? "zb-dwt-slot" : "zb-dbf-slot");
      if (!slot) return;
      const cur = which === "wt" ? D_WT.toFixed(1) : D_BF.toFixed(1);
      slot.innerHTML = `<input class="zb-dial-in" type="number" step="0.1" inputmode="decimal" value="${cur}" />`;
      const inp = slot.querySelector ? slot.querySelector("input") : null;
      if (!inp) return;
      inp.focus(); if (inp.select) inp.select();
      const done = () => {
        const v = parseFloat(inp.value);
        if (!isNaN(v)) {
          if (which === "wt" && v >= 45 && v <= 120) D_WT = +v.toFixed(1);
          if (which === "bf" && v >= 6 && v <= 40) { D_BF = +v.toFixed(1); D_SKIP_BF = false; }
        }
        slot.innerHTML = "";
        renderDial();
      };
      inp.addEventListener("blur", done);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
    },
    saveWeigh() {
      const wv = +D_WT.toFixed(1), bf = D_SKIP_BF ? null : +D_BF.toFixed(1);
      const winp = ge("zb-waist-in");
      const rawW = winp ? parseFloat(winp.value) : NaN;
      const waist = (!isNaN(rawW) && rawW >= 50 && rawW <= 150) ? +rawW.toFixed(1) : null;
      const t = todayYmd(), d = ensureDay(t);
      d.wt = wv; if (bf !== null) d.bf = bf;
      if (waist !== null) d.waist = waist;
      if (!Array.isArray(ST.wb)) ST.wb = [];
      const ix = ST.wb.findIndex(r => r[0] === t);
      const prevWaist = (ix >= 0 && ST.wb[ix].length > 4) ? ST.wb[ix][4] : null;
      const finalWaist = waist !== null ? waist : prevWaist;
      const row = finalWaist !== null ? [t, wv, bf, "phone", finalWaist] : [t, wv, bf, "phone"];
      if (ix >= 0) ST.wb[ix] = row; else ST.wb.push(row);
      ST.wb.sort((a, b) => a[0].localeCompare(b[0]));
      this.toggleWForm(false); schedPush(); render();
      const wTag = waist !== null ? ` · 腰围 ${waist.toFixed(1)}cm` : "";
      toast(bf !== null ? `已记 ${wv.toFixed(1)} kg · GE ${bf.toFixed(1)}%${wTag}` : `已记体重 ${wv.toFixed(1)} kg${wTag}`);
    },
    toggleDay(ymd) { EXP_DAY = EXP_DAY === ymd ? null : ymd; render(); },
    edCardio(ymd, field, val) {
      const d = ensureDay(ymd);
      if (field === "clear") { d.pelo = null; d.pelo_min = 0; d.bb = null; toast(`${ymd.slice(5)} 已清空`); }
      else if (field === "pelo") { d.pelo = d.pelo === val ? null : val; d.pelo_min = d.pelo === "done" ? 40 : (d.pelo === "recovery" ? 20 : 0); toast(`${ymd.slice(5)} 已更新`); }
      else if (field === "bb") { d.bb = d.bb === val ? null : val; toast(`${ymd.slice(5)} 已更新`); }
      schedPush(); render();
    },
    edPU(ymd, n) {
      const d = ensureDay(ymd), stg = puStage();
      d.pu = [];
      for (let i = 0; i < n; i++) d.pu.push([stg.defStrict, stg.neg]);
      schedPush(); render(); toast(`${ymd.slice(5)} 引体已改为 ${n} 轮`);
    },
    edDiet(ymd) {
      const d = ensureDay(ymd); d.diet = d.diet ? 0 : 1;
      schedPush(); render(); toast(d.diet ? `${ymd.slice(5)} 饮食达标已补记` : `${ymd.slice(5)} 已取消`);
    },
    syncNow() { pullCloud(false); }
  };
})();

window.addEventListener("hashchange", () => {
  if (location.hash && (location.hash.includes("k=") || location.hash.includes("bk="))) location.reload();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && window.ZB && ZB.onResume) ZB.onResume();
});
window.addEventListener("DOMContentLoaded", () => {
  if (window.ZB && ZB.onEnter) {
    ZB.onEnter().then(() => {
      renderStandaloneHorizon();
      positionThumbNavBar(true);
    });
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
});
</script>
</body>
</html>

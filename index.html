<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="体律" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+JP:wght@500;600&display=optional" rel="stylesheet" />
<title>体律</title>
<style>
  :root {
    /* Traditional Japanese Pigments: 生成り · 白練 · 墨 · 苔色 · 黄土 · 弁柄 */
    --washi: #F5F2EB;
    --sheet: #FCFBF8;
    --sumi: #1C1B18;
    --ink-2: #48443C;
    --ink-3: #847E72;
    --hairline: rgba(28, 27, 24, 0.09);
    --hairline-strong: rgba(28, 27, 24, 0.18);
    --track: #E5E0D5;
    --moss: #2B5F49;
    --moss-solid: #2D7A56;
    --moss-soft: rgba(43, 95, 73, 0.09);
    --ochre: #A87633;
    --bengara: #9E3E36;
    --toast-bg: #1C1B18;
    --toast-fg: #FCFBF8;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, sans-serif;
    --serif: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", "Noto Serif CJK SC", "Songti SC", Georgia, serif;
  }

  /* Adaptive Night-Ink Zen Mode (夜墨) */
  @media (prefers-color-scheme: dark) {
    :root {
      --washi: #171614;
      --sheet: #201F1C;
      --sumi: #EAE5DA;
      --ink-2: #B9B2A5;
      --ink-3: #868074;
      --hairline: rgba(234, 229, 218, 0.09);
      --hairline-strong: rgba(234, 229, 218, 0.21);
      --track: #2F2D28;
      --moss: #62AD89;
      --moss-solid: #3F8B66;
      --moss-soft: rgba(98, 173, 137, 0.14);
      --ochre: #D2A35C;
      --bengara: #D46F66;
      --toast-bg: #EAE5DA;
      --toast-fg: #171614;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--washi);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 24px calc(14px + env(safe-area-inset-bottom));
  }

  .zen-shell {
    width: 100%;
    max-width: 496px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  #main-app {
    animation: appFadeIn 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes appFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Strict portrait guard on mobile */
  html.fp {
    width: var(--fp-w);
    height: var(--fp-h);
    overflow: hidden;
  }
  html.fp body {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--fp-h) !important;
    height: var(--fp-w) !important;
    padding-left: 24px;
    padding-right: 24px;
    transform-origin: 0 0;
  }
  html.fp-90 body { transform: translateY(var(--fp-h)) rotate(-90deg); }
  html.fp-270 body { transform: translateX(var(--fp-w)) rotate(90deg); }

  button, a {
    font-family: inherit;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
    text-decoration: none;
  }

  input {
    font-family: inherit;
    -webkit-user-select: text;
    user-select: text;
  }

  /* Desktop Header (hidden on mobile per 上看下点) */
  .zen-header {
    display: none;
    flex-shrink: 0;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 10px;
  }
  .zen-brand {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--sumi);
  }
  .zen-brand span {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--ink-3);
    margin-left: 10px;
  }
  .zen-nav {
    display: flex;
    gap: 22px;
    position: relative;
  }
  .nav-link {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 4px 0;
    position: relative;
    transition: color 0.2s ease;
  }
  .nav-link.active {
    color: var(--sumi);
    font-weight: 600;
  }
  .desk-ink-bar {
    position: absolute;
    left: 0;
    bottom: -2px;
    height: 1.5px;
    background: var(--sumi);
    border-radius: 2px;
    pointer-events: none;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), width 0.26s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Top Horizon Bar: 3 Zen Enso Circles + Quiet Target Metric */
  .zen-horizon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 10px;
  }
  .enso-trio {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .enso-item {
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .enso-svg {
    width: 26px;
    height: 26px;
    display: block;
    overflow: visible;
  }
  .enso-item.just-done .enso-fill {
    animation: ensoPop 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: 14px 14px;
  }
  .enso-item.just-done .enso-check {
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    animation: checkDraw 0.34s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes ensoPop {
    0% { transform: scale(0.76); opacity: 0.55; }
    62% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes checkDraw {
    to { stroke-dashoffset: 0; }
  }
  .horizon-metric {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .horizon-metric b {
    color: var(--sumi);
    font-weight: 600;
  }

  /* Pull-to-Refresh Zen Ring */
  .ptr-wrap {
    flex-shrink: 0;
    height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0;
    transition: height 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .ptr-wrap.dragging {
    transition: none;
  }
  .ptr-svg {
    width: 20px;
    height: 20px;
    display: block;
  }
  .ptr-wrap.syncing .ptr-svg {
    animation: ptrSpin 0.85s linear infinite;
  }
  @keyframes ptrSpin {
    to { transform: rotate(360deg); }
  }
  .ptr-lbl {
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }

  /* Main Viewport: Airy Ma spacing, pushes interactive controls into right-thumb zone on mobile */
  .zen-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: relative;
  }
  .zen-stage::-webkit-scrollbar { display: none; }

  .stage-spacer {
    flex: 1 1 20px;
    min-height: 14px;
  }

  .view-panel {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 100%;
    will-change: transform, opacity;
  }
  .view-panel.active {
    display: flex;
  }
  .view-panel.slide-from-right {
    animation: slideFromRight 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .view-panel.slide-from-left {
    animation: slideFromLeft 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideFromRight {
    from { opacity: 0.25; transform: translateX(18px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideFromLeft {
    from { opacity: 0.25; transform: translateX(-18px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Quiet Context Line */
  .context-line {
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0.03em;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .tier-tag { font-weight: 500; }
  .tier-tag.green { color: var(--moss); }
  .tier-tag.yellow { color: var(--ochre); }
  .tier-tag.red { color: var(--bengara); }
  .tier-tag.cap { color: var(--ink-2); }

  /* Single Framed Focal Object per Screen */
  .focal-sheet {
    background: var(--sheet);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 25px 22px 21px;
    transition: border-color 0.28s ease, background-color 0.28s ease;
  }
  .focal-sheet.done {
    border-color: rgba(43, 95, 73, 0.32);
  }
  @media (prefers-color-scheme: dark) {
    .focal-sheet.done {
      border-color: rgba(98, 173, 137, 0.36);
    }
  }

  .focal-eyebrow {
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .focal-title {
    font-family: var(--serif);
    font-size: clamp(20px, 5.3vw, 23px);
    font-weight: 600;
    line-height: 1.4;
    color: var(--sumi);
    margin: 0 0 11px;
    letter-spacing: 0.01em;
  }
  .focal-sub {
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-2);
    margin: 0;
  }

  .focal-actions {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
  }

  /* Primary Solid Ink / Moss Button */
  .btn-primary {
    height: 44px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--sumi);
    color: var(--washi);
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.24s ease, opacity 0.2s ease;
  }
  .btn-primary:active { transform: scale(0.96); }
  .btn-primary.is-done {
    background: var(--moss-solid);
    color: #FCFBF8;
  }

  /* Frameless Muted Ink Secondary Action */
  .btn-quiet {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    padding: 9px 4px;
    letter-spacing: 0.02em;
    transition: color 0.18s ease, opacity 0.18s ease;
  }
  .btn-quiet:active { color: var(--sumi); opacity: 0.75; }
  .btn-quiet.is-active {
    color: var(--bengara);
    font-weight: 600;
  }
  .btn-quiet.is-active-moss {
    color: var(--moss);
    font-weight: 600;
  }

  /* Right-aligned Quick Override Strip below card */
  .quick-overrides {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    padding: 0 2px;
  }
  .radio-bridge {
    margin-right: auto;
    font-size: 12.5px;
    color: var(--ink-3);
    padding: 9px 2px;
    letter-spacing: 0.02em;
    transition: color 0.18s ease;
  }
  .radio-bridge:active { color: var(--moss); }

  /* Frameless Hairline Ritual Rows (Today pull-up + diet) */
  .ritual-list {
    margin-top: 20px;
    border-top: 1px solid var(--hairline);
  }
  .ritual-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 2px;
    border-bottom: 1px solid var(--hairline);
    gap: 12px;
  }
  .ritual-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .ritual-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--sumi);
  }
  .ritual-hint {
    font-size: 12.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .ritual-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .tap-check {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    padding: 8px 2px;
    transition: color 0.2s ease, transform 0.14s ease;
  }
  .tap-check:active { transform: scale(0.95); }
  .tap-check.done {
    color: var(--moss);
    font-weight: 600;
  }

  /* Pull-up View Controls */
  .rep-row {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-variant-numeric: tabular-nums;
  }
  .step-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--sumi);
    transition: background-color 0.15s ease, transform 0.12s ease;
  }
  .step-btn:active { background: var(--hairline); transform: scale(0.93); }
  .step-val {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    min-width: 24px;
    text-align: center;
  }

  /* Zen 4-Second Eccentric Breathing Pacer */
  .pacer-box {
    display: none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: appFadeIn 0.22s ease;
  }
  .pacer-box.open { display: flex; }
  .pacer-ring-wrap {
    position: relative;
    width: 112px;
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pacer-svg {
    width: 112px;
    height: 112px;
    display: block;
    overflow: visible;
  }
  .pacer-num {
    position: absolute;
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .pacer-phase {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  .pacer-controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 2px;
  }

  .stage-ladder {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding-top: 15px;
    border-top: 1px solid var(--hairline);
  }
  .ladder-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .ladder-bar {
    height: 2px;
    background: var(--track);
    border-radius: 2px;
    transition: background-color 0.25s ease;
  }
  .ladder-step.past .ladder-bar,
  .ladder-step.now .ladder-bar {
    background: var(--moss);
  }
  .ladder-lbl {
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .ladder-step.now .ladder-lbl {
    color: var(--sumi);
    font-weight: 600;
  }

  /* Body Fat & Weight Chart View */
  .stat-pair {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 14px;
  }
  .stat-big {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--sumi);
    transition: color 0.16s ease;
  }
  .stat-big.scrubbing {
    color: var(--moss);
  }
  .stat-unit {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-3);
    margin-left: 3px;
  }
  .stat-sub {
    font-size: 12.5px;
    color: var(--ink-3);
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }
  .chart-wrap {
    width: 100%;
    margin: 4px 0 2px;
    touch-action: pan-y;
    cursor: crosshair;
    position: relative;
  }
  .chart-svg {
    width: 100%;
    height: auto;
    aspect-ratio: 360 / 156;
    display: block;
    overflow: visible;
  }
  .chart-switches {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 11px;
    border-top: 1px solid var(--hairline);
  }
  .switch-group {
    display: flex;
    gap: 14px;
  }

  /* Zero-Keyboard Tactile Dial Weigh-in Drawer */
  .weigh-drawer {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    flex-direction: column;
    gap: 14px;
    animation: appFadeIn 0.2s ease;
  }
  .weigh-drawer.open { display: flex; }
  .dial-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dial-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dial-label {
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .dial-ctrl {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .dial-val-btn {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--sumi);
    font-variant-numeric: tabular-nums;
    min-width: 68px;
    text-align: center;
    border-bottom: 1px dashed var(--hairline-strong);
    padding-bottom: 1px;
  }
  .dial-inline-input {
    width: 68px;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    text-align: center;
    color: var(--sumi);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--moss);
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  .dial-track {
    position: relative;
    height: 30px;
    border-radius: 8px;
    background: var(--washi);
    border: 1px solid var(--hairline);
    overflow: hidden;
    touch-action: none;
    cursor: ew-resize;
  }
  .dial-ticks {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 9px,
        var(--hairline-strong) 9px,
        var(--hairline-strong) 10px
      );
    background-size: 50px 100%;
    opacity: 0.85;
  }
  .dial-needle {
    position: absolute;
    left: 50%;
    top: 4px;
    bottom: 4px;
    width: 2px;
    margin-left: -1px;
    background: var(--moss);
    border-radius: 2px;
    pointer-events: none;
  }
  .dial-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2px;
  }

  /* Ledger View (总账) */
  .ledger-kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .kpi-val {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--sumi);
  }
  .kpi-lbl {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 3px;
  }
  .day-ledger {
    margin-top: 6px;
  }
  .day-item {
    border-bottom: 1px solid var(--hairline);
  }
  .day-row {
    width: 100%;
    display: grid;
    grid-template-columns: 56px 1fr 54px 30px;
    align-items: center;
    padding: 12px 2px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: left;
    transition: background-color 0.16s ease;
  }
  .day-row:active {

<script>
"use strict";

/* ===================== 1. STRICT PORTRAIT GUARD (Mobile) ===================== */
let FP_ANGLE = 0;
let APP_READY = false;
function tryLockPortrait() {
  try {
    if (screen && screen.orientation && typeof screen.orientation.lock === "function") {
      screen.orientation.lock("portrait").catch(() => {});
    }
  } catch (e) {}
}
function applyPortraitGuard() {
  const root = document.documentElement;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const isPhoneTouch = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) && Math.min(w, h) <= 520;
  let a = 0;
  if (isPhoneTouch && w > h) {
    const ang = (screen && screen.orientation && typeof screen.orientation.angle === "number")
      ? screen.orientation.angle
      : (typeof window.orientation === "number" ? window.orientation : 90);
    a = (ang === 270 || ang === -90) ? 270 : 90;
  }
  FP_ANGLE = a;
  root.classList.toggle("fp", a !== 0);
  root.classList.toggle("fp-90", a === 90);
  root.classList.toggle("fp-270", a === 270);
  if (a) {
    root.style.setProperty("--fp-w", w + "px");
    root.style.setProperty("--fp-h", h + "px");
  }
  if (APP_READY) positionNavBars(true);
}
applyPortraitGuard();
tryLockPortrait();
window.addEventListener("resize", applyPortraitGuard);
window.addEventListener("orientationchange", () => { tryLockPortrait(); setTimeout(applyPortraitGuard, 60); });
document.addEventListener("touchstart", tryLockPortrait, { once: true, passive: true });

/* ===================== 2. DATE & TIMEZONE (PT, 04:00 AM ROLLOVER) ===================== */
function getPTNow(offsetHours = 0) {
  const now = new Date(Date.now() + offsetHours * 3600 * 1000);
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Los_Angeles",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false
  }).formatToParts(now);
  const map = {};
  for (const p of parts) map[p.type] = p.value;
  return {
    ymd: `${map.year}-${map.month}-${map.day}`,
    year: Number(map.year),
    month: Number(map.month),
    day: Number(map.day),
    hour: Number(map.hour),
    minute: Number(map.minute),
    weekday: map.weekday
  };
}
function formatEpochPT(epochSec) {
  if (!epochSec) return "";
  const dt = new Date(epochSec * 1000);
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "America/Los_Angeles",
    hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(dt);
  const m = {};
  for (const p of parts) m[p.type] = p.value;
  return `${m.hour}:${m.minute}`;
}
function getFitnessDate() {
  return getPTNow(-4).ymd;
}
function shiftDate(ymd, deltaDays) {
  const [y, m, d] = ymd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
  return dt.toISOString().slice(0, 10);
}
function formatCnDate(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12));
  const wds = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  return `${m}月${d}日 ${wds[dt.getUTCDay()]}`;
}
function getMondayOfWeek(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12));
  const dow = dt.getUTCDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  return shiftDate(ymd, diff);
}

/* ===================== 3. AES-256-GCM ENCRYPTED CLOUD VAULT ===================== */
const VAULT_STORAGE_KEY = "zenbody_vault_v1";
const STATE_STORAGE_KEY = "zenbody_state_v1";
const PENDING_PUSH_KEY = "zenbody_pending_push_v1";

function b64uToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64u(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

let VAULT = null;
let CRYPTO_KEY = null;
let DEFERRED_INSTALL_PROMPT = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();

  if (btn && !isStandalone) btn.style.display = "inline-block";

async function triggerInstallApp() {
  if (!DEFERRED_INSTALL_PROMPT) return;
  try {
    DEFERRED_INSTALL_PROMPT.prompt();
    await DEFERRED_INSTALL_PROMPT.userChoice;
  } catch (e) {}
  DEFERRED_INSTALL_PROMPT = null;
  const btn = document.getElementById("install-app-btn");
  if (btn) btn.style.display = "none";
}

async function saveVaultEverywhere(v) {
  try { localStorage.setItem(VAULT_STORAGE_KEY, JSON.stringify(v)); } catch (e) {}
  try {
    if ("caches" in window) {
      const c = await caches.open("zenbody-vault-cache");
      await c.put("./__vault_key__", new Response(JSON.stringify(v), { headers: { "Content-Type": "application/json" } }));
    }
  } catch (e) {}
}

async function loadVaultFromCache() {
  try {
    if ("caches" in window) {
      const c = await caches.open("zenbody-vault-cache");
      const r = await c.match("./__vault_key__");
      if (r) return await r.json();
    }
  } catch (e) {}
  return null;
}

function updateDynamicManifest(v) {
  try {

function parseVaultFromStr(str) {
  if (!str) return null;
  const idx = str.indexOf("#");
  const raw = idx >= 0 ? str.slice(idx + 1) : str.replace(/^#/, "");
  const params = new URLSearchParams(raw);
  const t = params.get("t");
  const k = params.get("k");
  if (t && k && t.length >= 16 && k.length >= 40) return { t, k };
  return null;
}

async function initVault() {
  const fromHash = parseVaultFromStr(window.location.hash || "");
  if (fromHash) {
    VAULT = fromHash;
    await saveVaultEverywhere(VAULT);
  }
  if (!VAULT) {
    try {
      const saved = localStorage.getItem(VAULT_STORAGE_KEY);
      if (saved) VAULT = JSON.parse(saved);
    } catch (e) {}
  }
  if (!VAULT) {
    const cached = await loadVaultFromCache();
    if (cached && cached.t && cached.k) {
      VAULT = cached;
      try { localStorage.setItem(VAULT_STORAGE_KEY, JSON.stringify(VAULT)); } catch (e) {}
    }
  }
  if (!VAULT || !VAULT.t || !VAULT.k) return false;
  try {
    const rawKey = b64uToBytes(VAULT.k);
    CRYPTO_KEY = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
    updateDynamicManifest(VAULT);
    return true;
  } catch (e) {
    return false;
  }
}

async function encryptPayload(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify(obj));
  const ctBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, CRYPTO_KEY, plain);
  const ct = new Uint8Array(ctBuf);
  const combined = new Uint8Array(iv.length + ct.length);
  combined.set(iv, 0);
  combined.set(ct, iv.length);
  return "z1." + bytesToB64u(combined);
}

async function decryptPayload(str) {
  if (!str || !str.startsWith("z1.")) return null;
  try {
    const raw = b64uToBytes(str.slice(3));
    if (raw.length < 29) return null;
    const iv = raw.slice(0, 12);
    const ct = raw.slice(12);
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, CRYPTO_KEY, ct);
    return JSON.parse(new TextDecoder().decode(plainBuf));
  } catch (e) {
    return null;
  }
}

function saveLocalState() {

}

function mergeStates(a, b) {
  if (!b || typeof b !== "object") return a;
  const newer = (b.ts || 0) >= (a.ts || 0) ? b : a;
  const older = newer === b ? a : b;
  const out = {
    v: 1,
    ts: Math.max(a.ts || 0, b.ts || 0),
    targets: Object.assign({}, older.targets || {}, newer.targets || {}),
    pu_best: Math.max(a.pu_best || 1, b.pu_best || 1),
    vitals: Object.assign({}, older.vitals || {}, newer.vitals || {}),
    trips: (newer.trips && newer.trips.length) ? newer.trips : (older.trips || []),
    wb: [],
    acts: [],
    days: {}
  };
  if ((a.vitals && a.vitals.last_drive_sync || "") > (out.vitals.last_drive_sync || "")) {
    out.vitals = Object.assign({}, out.vitals, a.vitals);
  }
  if ((b.vitals && b.vitals.last_drive_sync || "") > (out.vitals.last_drive_sync || "")) {
    out.vitals = Object.assign({}, out.vitals, b.vitals);
  }

  const wbMap = new Map();
  for (const list of [older.wb || [], newer.wb || []]) {
    for (const row of list) {
      if (!row || !row[0]) continue;
      const prev = wbMap.get(row[0]);
      if (!prev) {
        wbMap.set(row[0], row.slice());
      } else {
        const kg = row[1] || prev[1];
        const bf = (row[2] && row[2] > 5) ? row[2] : prev[2];
        const src = (row[2] && row[2] > 5) ? (row[3] || prev[3]) : (prev[3] || row[3]);
        wbMap.set(row[0], [row[0], kg, bf, src]);
      }
    }
  }
  out.wb = Array.from(wbMap.values()).sort((x, y) => x[0].localeCompare(y[0]));

  const actMap = new Map();
  for (const list of [older.acts || [], newer.acts || []]) {
    for (const r of list) {
      if (!r || !r[0]) continue;
      const key = `${r[0]}|${r[1]}|${Math.round((r[2] || 0) / 5)}`;
      actMap.set(key, r.slice());
    }
  }
  out.acts = Array.from(actMap.values()).sort((x, y) => x[0].localeCompare(y[0]));

  const allDayKeys = new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})]);
  for (const k of allDayKeys) {
    const da = (a.days && a.days[k]) || null;
    const db = (b.days && b.days[k]) || null;
    if (!da) { out.days[k] = Object.assign({}, db); continue; }
    if (!db) { out.days[k] = Object.assign({}, da); continue; }
    const dn = (db.ts || 0) >= (da.ts || 0) ? db : da;
    const do_ = dn === db ? da : db;
    out.days[k] = Object.assign({}, do_, dn);
  }
  return out;
}

function compactStateForTransport(st) {
  const today = getFitnessDate();
  const cutoff21 = shiftDate(today, -21);
  const compactDays = {};
  for (const [k, v] of Object.entries(st.days || {})) {
    if (k >= cutoff21) compactDays[k] = v;
  }
  const wbAll = st.wb || [];
  let wbCompact = wbAll;
  if (wbAll.length > 36) {
    const recent = wbAll.slice(-20);
    const recentSet = new Set(recent.map(r => r[0]));
    const earlier = wbAll.filter(r => !recentSet.has(r[0]));
    const byMonth = new Map();
    for (const r of earlier) byMonth.set(r[0].slice(0, 7), r);
    wbCompact = [...Array.from(byMonth.values()).slice(-16), ...recent];
  }
  return {
    v: 1,
    ts: st.ts || Math.floor(Date.now() / 1000),
    targets: st.targets,
    pu_best: st.pu_best,
    vitals: st.vitals,
    trips: st.trips || [],
    wb: wbCompact,
    acts: (st.acts || []).slice(-18),
    days: compactDays
  };
}

async function pullFromCloud(silent = true) {
  if (!VAULT || !CRYPTO_KEY) return false;
  let mergedCount = 0;
  try {
    const vRes = await fetch(`./vault.enc?t=${Date.now()}`, { cache: "no-store" });
    if (vRes.ok) {
      const cipher = (await vRes.text()).trim();
      const dec = await decryptPayload(cipher);
      if (dec && dec.v === 1) {
        STATE = mergeStates(STATE, dec);
        mergedCount++;
      }
    }
  } catch (e) {}

  try {
    const url = `https://ntfy.sh/${encodeURIComponent(VAULT.t)}/json?poll=1&since=all`;
    const res = await fetch(url, { cache: "no-store" });
    if (res.ok) {
      const text = await res.text();
      const lines = text.trim().split("\n").filter(Boolean);
      for (const line of lines) {
        try {
          const ev = JSON.parse(line);
          if (ev.event !== "message" || !ev.message) continue;
          const dec = await decryptPayload(ev.message.trim());
          if (dec && dec.v === 1) {
            STATE = mergeStates(STATE, dec);
            mergedCount++;
          }
        } catch (e) {}
      }
    }
    if (mergedCount > 0) {
      saveLocalState();
      syncPullupInputDefault();
    }
    const pt = getPTNow();
    LAST_SYNC_NOTE = `云端已同步 · ${String(pt.hour).padStart(2, "0")}:${String(pt.minute).padStart(2, "0")}`;
    renderAll();
    if (!silent) showToast("已同步最新数据");
    return true;
  } catch (e) {
    if (mergedCount > 0) saveLocalState();
    LAST_SYNC_NOTE = "离线模式 · 联网后自动同步";
    renderAll();
    if (!silent) showToast("当前离线，已保留本地记录");
    return false;
  }
}

async function pushToCloudNow() {
  if (!VAULT || !CRYPTO_KEY) return;
  try {
    const payload = compactStateForTransport(STATE);
    let enc = await encryptPayload(payload);
    if (enc.length > 3850) {
      payload.wb = payload.wb.slice(-24);
      payload.acts = payload.acts.slice(-12);
      enc = await encryptPayload(payload);
    }
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(VAULT.t)}`, {
      method: "POST",
      body: enc
    });
    if (res.ok) {
      try { localStorage.removeItem(PENDING_PUSH_KEY); } catch (e) {}
      const pt = getPTNow();
      LAST_SYNC_NOTE = `已加密同步 · ${String(pt.hour).padStart(2, "0")}:${String(pt.minute).padStart(2, "0")}`;
      const el = document.getElementById("sync-status-txt");

    } else {
      try { localStorage.setItem(PENDING_PUSH_KEY, "1"); } catch (e) {}
    }
  } catch (e) {
    try { localStorage.setItem(PENDING_PUSH_KEY, "1"); } catch (err) {}
  }
}

function schedulePush() {
  STATE.ts = Math.floor(Date.now() / 1000);
  saveLocalState();
  try { localStorage.setItem(PENDING_PUSH_KEY, "1"); } catch (e) {}

/* ===================== 5. DYNAMIC FITNESS BRAIN ENGINE ===================== */
function getDayEntry(ymd) {
  return (STATE.days && STATE.days[ymd]) || {};
}

function getDriveActsForDate(ymd) {
  return (STATE.acts || []).filter(a => a[0] === ymd);
}

function getBasketballForDate(ymd) {
  const day = getDayEntry(ymd);
  const driveBB = getDriveActsForDate(ymd).filter(a => a[1] === "bb");
  if (driveBB.length > 0) {
    const dur = driveBB.reduce((s, r) => s + (r[2] || 0), 0);
    const kcal = driveBB.reduce((s, r) => s + (r[3] || 0), 0);
    const avgHr = Math.max(...driveBB.map(r => r[4] || 0));
    const maxHr = Math.max(...driveBB.map(r => r[5] || 0));
    const level = (dur >= 40 || kcal >= 700 || avgHr >= 125) ? "high" : "light";
    return { level, dur: Math.round(dur), kcal: Math.round(kcal), avgHr, maxHr, src: "drive" };
  }
  if (day.bb === "high" || day.bb === "light") {
    return { level: day.bb, dur: 0, kcal: 0, avgHr: 0, maxHr: 0, src: "tap" };
  }
  return null;
}

function getPelotonForDate(ymd) {
  const day = getDayEntry(ymd);
  const drivePelo = getDriveActsForDate(ymd).filter(a => a[1] === "pelo");
  if (drivePelo.length > 0) {
    const dur = Math.round(drivePelo.reduce((s, r) => s + (r[2] || 0), 0));
    return { status: "done", min: dur, src: "drive" };
  }
  if (day.pelo) return { status: day.pelo, min: day.pelo_min || 0, src: "tap" };
  return null;
}

function getActiveTrip(ymd) {
  for (const tr of (STATE.trips || [])) {
    if (ymd >= tr.start && ymd <= tr.end) return tr;
  }
  return null;
}

function getWeeklyStats(todayYmd) {
  const mon = getMondayOfWeek(todayYmd);
  let bbHigh = 0, bbLight = 0, peloMain = 0, peloRec = 0, puRounds = 0, dietDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = shiftDate(mon, i);
    if (d > todayYmd) break;
    const bb = getBasketballForDate(d);
    if (bb) {
      if (bb.level === "high") bbHigh++;
      else bbLight++;
    }
    const pelo = getPelotonForDate(d);
    if (pelo) {
      if (pelo.status === "done") peloMain++;
      else if (pelo.status === "recovery") peloRec++;
    }
    const de = getDayEntry(d);
    puRounds += (de.pu || []).length;
    if (de.diet) dietDays++;
  }
  return { mon, bbHigh, bbLight, peloMain, peloRec, totalHardCardio: bbHigh + peloMain, puRounds, dietDays };
}

      idx: 1,
      code: "阶段二 · 双连巩固",
      title: "每轮 2 个标准连拉 + 1 次慢放",
      sub: "依然每轮不超过 3 下、每天最多 2 轮。全程直上直下不晃腿，稳固后再冲 3 连拉。",
      defaultStrict: 2,
      negReps: 1,
      maxRounds: 2
    };
  }
  if (best < 4) {
    return {
      idx: 2,
      code: "阶段三 · 三连进阶",
      title: "每轮 3 个标准连拉 · 每天 2 轮",
      sub: "全程控制下放不借力；每周选精力最好的一天，第 1 轮试拉第 4 个。",
      defaultStrict: 3,
      negReps: 0,
      maxRounds: 2
    };
  }
  return {
    idx: 3,
    code: "阶段四 · 锁死五连",
    title: "每轮 4 至 5 个轻松标准连拉",
    sub: "稳稳把 5 个严格引体变成日常轻松动作，提前锁定 2027 年底目标。",
    defaultStrict: Math.min(5, best),
    negReps: 0,
    maxRounds: 2
  };
}

function getPullupCooldownNote(day, puTarget) {
  const rounds = (day && day.pu) || [];
  if (rounds.length === 1 && puTarget >= 2) {
    const ts1 = rounds[0] && rounds[0][2];
    if (ts1) {
      const t1Str = formatEpochPT(ts1);
      const readyTs = ts1 + 7200;
      const readyStr = formatEpochPT(readyTs);
      const nowSec = Math.floor(Date.now() / 1000);
      return nowSec < readyTs
        ? `第 1 轮 ${t1Str} 已拉 · ${readyStr} 后可拉第 2 轮`
        : `第 1 轮 ${t1Str} 已拉 · 现在可拉第 2 轮`;
    }
    return "第 1 轮已完成 · 间隔 2 小时后再拉第 2 轮";
  }
  if (rounds.length >= 2) {
    const ts2 = rounds[1] && rounds[1][2];
    return ts2 ? `今日 2 轮已于 ${formatEpochPT(ts2)} 满额收工` : "今日 2 轮已满额收工";
  }
  return "";
}

function syncPullupInputDefault() {
  PU_STRICT_INPUT = getPullupStage().defaultStrict;
}

/* ===================== 6. RENDERING ===================== */
function renderEnsoSVG(ratio, isDone) {
  if (isDone) {
    return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
      <circle class="enso-fill" cx="14" cy="14" r="10.2" fill="var(--moss-solid)"/>
      <path class="enso-check" d="M 9.6 14.3 L 12.6 17.2 L 18.7 10.9" fill="none" stroke="#FCFBF8" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (ratio > 0.01) {
    const pct = Math.max(10, Math.min(95, Math.round(ratio * 100)));
    return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="9.8" fill="none" stroke="var(--hairline-strong)" stroke-width="1.8"/>
      <circle cx="14" cy="14" r="9.8" pathLength="100" fill="none" stroke="var(--moss-solid)" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="${pct} 100" transform="rotate(-90 14 14)"/>
    </svg>`;
  }
  return `<svg class="enso-svg" viewBox="0 0 28 28" aria-hidden="true">
    <circle cx="14" cy="14" r="9.8" fill="none" stroke="var(--hairline-strong)" stroke-width="1.75" stroke-dasharray="54 7" stroke-linecap="round" transform="rotate(-40 14 14)"/>
  </svg>`;
}

function getLatestBodyMetrics() {
  const wb = STATE.wb || [];
  let latestWt = null, latestBf = null, bestBf = null;
  for (const r of wb) {
    if (r[1]) latestWt = { date: r[0], val: r[1] };
    if (r[2] && r[2] > 5) {
      latestBf = { date: r[0], val: r[2] };
      if (!bestBf || r[2] < bestBf.val) bestBf = { date: r[0], val: r[2], wt: r[1] };
    }
  }
  const validWts = wb.filter(r => r[1]).slice(-5);
  const avgWt = validWts.length ? +(validWts.reduce((s, r) => s + r[1], 0) / validWts.length).toFixed(1) : null;
  return { latestWt, latestBf, bestBf, avgWt };
}

function renderAll() {
  const today = getFitnessDate();
  const plan = computeDynamicPlan(today);
  const day = getDayEntry(today);
  const puRounds = (day.pu || []).length;
  const puTarget = plan.puTargetRounds;
  const puDone = puTarget === 0 ? true : puRounds >= puTarget;
  const puRatio = puTarget > 0 ? Math.min(1, puRounds / puTarget) : 1;
  const dietDone = !!day.diet;
  const body = getLatestBodyMetrics();

  document.getElementById("desk-date").textContent = formatCnDate(today);

  // Top Enso Trio (animate only circles newly transitioned to done)
  const ensoTrio = document.getElementById("enso-trio");
  const circles = [
    { done: plan.cardioDone, ratio: plan.cardioDone ? 1 : 0, title: "心肺" },
    { done: puDone, ratio: puRatio, title: "引体" },
    { done: dietDone, ratio: dietDone ? 1 : 0, title: "节律" }
  ];
  ensoTrio.innerHTML = circles.map((c, idx) => {
    const justDone = PREV_ENSO_DONE !== null && c.done && !PREV_ENSO_DONE[idx];
    return `<span class="enso-item ${c.done ? "is-done" : ""} ${justDone ? "just-done" : ""}" title="${c.title}">${renderEnsoSVG(c.ratio, c.done)}</span>`;
  }).join("");
  PREV_ENSO_DONE = circles.map(c => c.done);

  // Top Right Quiet Target Readout
  const bfStr = body.latestBf ? `${body.latestBf.val.toFixed(1)}%` : "--%";
  document.getElementById("horizon-metric").innerHTML = `GE <b>${bfStr}</b> → 14%`;

  renderToday(today, plan, day, puRounds, puTarget, puDone, dietDone);
  renderPullup(today, plan, day, puRounds, puTarget);
  renderBody(today, body);
  renderLedger(today, plan, body);
}

function applyBodyHeadline(today, body, scrubPt) {
  const targetBf = (STATE.targets && STATE.targets.bf_ge) || 14.0;
  const deadline = (STATE.targets && STATE.targets.deadline) || "2027-12-31";
  const bfBigEl = document.getElementById("body-bf-big");
  const wtBigEl = document.getElementById("body-wt-big");
  const ctxLeft = document.getElementById("body-context-left");

  if (scrubPt) {
    bfBigEl.classList.add("scrubbing");
    wtBigEl.classList.add("scrubbing");
    ctxLeft.textContent = `查看 ${scrubPt.d} 实测`;
    bfBigEl.innerHTML = `${scrubPt.bf !== null ? scrubPt.bf.toFixed(1) : "--"}<span class="stat-unit">%</span>`;
    wtBigEl.innerHTML = `${scrubPt.wt !== null ? scrubPt.wt.toFixed(1) : "--"}<span class="stat-unit">kg</span>`;
    const avgTxt = scrubPt.ma !== null ? `7 日均值 ${scrubPt.ma.toFixed(1)}${CHART_METRIC === "bf" ? "%" : " kg"}` : "";
    document.getElementById("body-bf-sub").textContent = `${formatCnDate(scrubPt.d)}`;
    document.getElementById("body-wt-sub").textContent = avgTxt || "手指松开恢复最新";
    return;
  }

  bfBigEl.classList.remove("scrubbing");
  wtBigEl.classList.remove("scrubbing");
  ctxLeft.textContent = "GE 智能秤趋势";

  const curBf = body.latestBf ? body.latestBf.val : null;
  const curWt = body.latestWt ? body.latestWt.val : null;
  const estTargetWt = (curWt && curBf) ? +((curWt * (1 - curBf / 100)) / (1 - targetBf / 100)).toFixed(1) : 77.5;

  bfBigEl.innerHTML = `${curBf !== null ? curBf.toFixed(1) : "--"}<span class="stat-unit">%</span>`;
  wtBigEl.innerHTML = `${curWt !== null ? curWt.toFixed(1) : "--"}<span class="stat-unit">kg</span>`;

  if (curBf !== null) {
    const diff = +(curBf - targetBf).toFixed(1);
    const monthsLeft = Math.max(1, Math.round((new Date(deadline) - new Date(today)) / (30.4 * 86400000)));
    const perMonth = (Math.max(0, diff) / monthsLeft).toFixed(2);
    document.getElementById("body-pace-label").textContent = diff > 0 ? `距 ${targetBf}% 剩 ${diff}% · 均月 ${perMonth}%` : `已达 ${targetBf}% 目标`;
    document.getElementById("body-bf-sub").textContent = body.bestBf
      ? `两年最低 ${body.bestBf.val.toFixed(1)}%`
      : `目标 ${targetBf}%`;
  } else {
    document.getElementById("body-pace-label").textContent = `目标 ${targetBf}%`;
    document.getElementById("body-bf-sub").textContent = "等待 GE 秤体脂记录";
  }

  document.getElementById("body-wt-sub").textContent = body.avgWt
    ? `均 ${body.avgWt} · 估标 ${estTargetWt} kg`
    : "7 日平滑均值";
}

function renderBody(today, body) {
  const targetBf = (STATE.targets && STATE.targets.bf_ge) || 14.0;
  const curBf = body.latestBf ? body.latestBf.val : null;
  const curWt = body.latestWt ? body.latestWt.val : null;
  const estTargetWt = (curWt && curBf) ? +((curWt * (1 - curBf / 100)) / (1 - targetBf / 100)).toFixed(1) : 77.5;

  CHART_SCRUB_IDX = -1;
  applyBodyHeadline(today, body, null);

  document.getElementById("btn-metric-bf").className = `btn-quiet ${CHART_METRIC === "bf" ? "is-active-moss" : ""}`;
  document.getElementById("btn-metric-wt").className = `btn-quiet ${CHART_METRIC === "wt" ? "is-active-moss" : ""}`;
  document.getElementById("btn-range-90").className = `btn-quiet ${CHART_RANGE === "90" ? "is-active-moss" : ""}`;
  document.getElementById("btn-range-all").className = `btn-quiet ${CHART_RANGE === "all" ? "is-active-moss" : ""}`;

  const lastDate = (body.latestBf && body.latestBf.date) || (body.latestWt && body.latestWt.date) || "";
  if (lastDate) {
    const gapDays = Math.round((new Date(today) - new Date(lastDate)) / 86400000);
    document.getElementById("body-reminder").textContent = gapDays >= 5
      ? `上次 GE 体脂 ${lastDate.slice(5)} · 记得光脚称一次`
      : `最近称重 ${lastDate.slice(5)}`;
  } else {
    document.getElementById("body-reminder").textContent = "";
  }

  const cutoff = CHART_RANGE === "90" ? shiftDate(today, -95) : "2020-01-01";
  const rawPts = (STATE.wb || [])
    .filter(r => r[0] >= cutoff)
    .map(r => ({
      d: r[0],
      wt: r[1] || null,
      bf: (r[2] && r[2] > 5) ? r[2] : null,
      v: CHART_METRIC === "bf" ? r[2] : r[1]
    }))
    .filter(p => p.v && p.v > 5);

  const wrap = document.getElementById("body-chart-wrap");
  if (rawPts.length < 2) {
    CHART_PTS = [];
    wrap.innerHTML = `<div style="height:146px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-3);">再记一次称重即显示曲线</div>`;
    return;
  }

  // Compute 7-day / 3-point smoothed moving average
  for (let i = 0; i < rawPts.length; i++) {
    const ti = new Date(rawPts[i].d).getTime();
    const win = [];
    for (let j = i; j >= 0; j--) {
      const dtDays = (ti - new Date(rawPts[j].d).getTime()) / 86400000;
      if (dtDays <= 14 || win.length < 2) win.push(rawPts[j].v);
      if (win.length >= 4) break;
    }
    rawPts[i].ma = +(win.reduce((a, b) => a + b, 0) / win.length).toFixed(2);
  }

  const W = 360, H = 156, padL = 6, padR = 38, padT = 16, padB = 22;
  const vals = rawPts.map(p => p.v);
  const goalVal = CHART_METRIC === "bf" ? targetBf : estTargetWt;
  const minV = Math.min(...vals, goalVal) - (CHART_METRIC === "bf" ? 0.8 : 1.0);
  const maxV = Math.max(...vals, goalVal) + (CHART_METRIC === "bf" ? 0.8 : 1.0);
  const spanV = Math.max(1, maxV - minV);

  const t0 = new Date(rawPts[0].d).getTime();
  const t1 = new Date(rawPts[rawPts.length - 1].d).getTime();
  const spanT = Math.max(86400000, t1 - t0);

  const xy = rawPts.map(p => {
    const x = padL + ((new Date(p.d).getTime() - t0) / spanT) * (W - padL - padR);
    const y = padT + (1 - (p.v - minV) / spanV) * (H - padT - padB);
    const yMa = padT + (1 - (p.ma - minV) / spanV) * (H - padT - padB);
    return { x: +x.toFixed(1), y: +y.toFixed(1), yMa: +yMa.toFixed(1), d: p.d, v: p.v, wt: p.wt, bf: p.bf, ma: p.ma };
  });
  CHART_PTS = xy;

  const goalY = +(padT + (1 - (goalVal - minV) / spanV) * (H - padT - padB)).toFixed(1);
  const pathD = xy.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
  const maD = xy.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.yMa}`).join(" ");
  const last = xy[xy.length - 1];
  const first = xy[0];

  wrap.innerHTML = `
    <svg class="chart-svg" id="body-chart-svg" viewBox="0 0 ${W} ${H}">
      <line x1="${padL}" y1="${goalY}" x2="${W - padR}" y2="${goalY}" stroke="var(--moss)" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="${W - padR + 5}" y="${goalY + 3.5}" fill="var(--moss)" font-size="10.5" font-family="sans-serif">${goalVal}${CHART_METRIC === "bf" ? "%" : ""}</text>
      <path d="${maD}" fill="none" stroke="var(--moss)" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${pathD}" fill="none" stroke="var(--sumi)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      ${xy.map(p => `<circle cx="${p.x}" cy="${p.y}" r="2.2" fill="var(--sheet)" stroke="var(--sumi)" stroke-width="1.25"/>`).join("")}
      <circle cx="${last.x}" cy="${last.y}" r="3.6" fill="var(--moss)"/>
      <line id="chart-cursor" x1="0" y1="${padT - 4}" x2="0" y2="${H - padB + 2}" stroke="var(--moss)" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2 3" style="display:none;"/>
      <circle id="chart-halo" cx="0" cy="0" r="6" fill="var(--moss)" fill-opacity="0.18" style="display:none;"/>
      <circle id="chart-focus" cx="0" cy="0" r="3.6" fill="var(--moss)" stroke="var(--sheet)" stroke-width="1.5" style="display:none;"/>

/* ===================== 7. SLIDING NAV INDICATOR & SILKY GESTURES ===================== */
function positionNavBars(immediate = false) {
  const configs = [
    { wrapId: "thumb-tabs", barId: "thumb-ink-bar", sel: `.thumb-link[data-tab="${CURRENT_TAB}"]`, inset: 15 },
    { wrapId: "desk-nav", barId: "desk-ink-bar", sel: `.nav-link[data-tab="${CURRENT_TAB}"]`, inset: 0 }
  ];
  for (const cfg of configs) {
    const wrap = document.getElementById(cfg.wrapId);
    const bar = document.getElementById(cfg.barId);
    if (!wrap || !bar) continue;
    const btn = wrap.querySelector(cfg.sel);
    if (!btn || wrap.offsetWidth === 0) continue;
    const left = btn.offsetLeft + cfg.inset;
    const width = Math.max(18, btn.offsetWidth - cfg.inset * 2);
    if (immediate) bar.style.transition = "none";
    bar.style.width = width + "px";
    bar.style.transform = `translateX(${left}px)`;
    if (immediate) {
      bar.offsetWidth; // force reflow
      bar.style.transition = "";
    }
  }
}

function switchTab(tab, directionHint = 0) {
  if (!TAB_ORDER.includes(tab)) return;
  if (tab === CURRENT_TAB) {
    positionNavBars(false);
    return;
  }
  if (PACER_ACTIVE) stopPacer(false);

  const prevIdx = TAB_ORDER.indexOf(CURRENT_TAB);
  const nextIdx = TAB_ORDER.indexOf(tab);
  const dir = directionHint !== 0 ? directionHint : (nextIdx > prevIdx ? 1 : -1);
  CURRENT_TAB = tab;

  document.querySelectorAll(".view-panel").forEach(el => {
    const isActive = el.id === `view-${tab}`;
    el.classList.remove("slide-from-right", "slide-from-left");
    el.style.transform = "";
    el.style.transition = "";
    el.classList.toggle("active", isActive);
    if (isActive) {
      void el.offsetWidth;
      el.classList.add(dir > 0 ? "slide-from-right" : "slide-from-left");
    }
  });
  document.querySelectorAll("[data-tab]").forEach(el => el.classList.toggle("active", el.getAttribute("data-tab") === tab));

  const stage = document.getElementById("zen-stage");
  if (stage) stage.scrollTop = 0;

  if (tab === "pullup") syncPullupInputDefault();
  renderAll();
  positionNavBars(false);
}

// One-Thumb Horizontal Swipe & Pull-to-Refresh on Stage
(function bindStageGestures() {
  const stage = document.getElementById("zen-stage");
  const ptrWrap = document.getElementById("ptr-wrap");
  const ptrArc = document.getElementById("ptr-arc");
  const ptrLbl = document.getElementById("ptr-lbl");
  if (!stage) return;

  let tracking = false;
  let mode = ""; // "h" | "ptr" | "v"
  let sx = 0, sy = 0, t0 = 0;
  let lastDx = 0, lastDy = 0;
  let ptrBusy = false;

  function toLocalDelta(rawDx, rawDy) {
    if (FP_ANGLE === 90) return { dx: -rawDy, dy: rawDx };
    if (FP_ANGLE === 270) return { dx: rawDy, dy: -rawDx };
    return { dx: rawDx, dy: rawDy };
  }

  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || ptrBusy) return;
    if (e.target.closest("[data-no-swipe], input, textarea")) return;
    const t = e.touches[0];
    tracking = true;
    mode = "";
    sx = t.clientX;
    sy = t.clientY;
    t0 = Date.now();
    lastDx = 0;
    lastDy = 0;
  }, { passive: true });

  stage.addEventListener("touchmove", (e) => {
    if (!tracking || e.touches.length !== 1) return;
    const t = e.touches[0];
    const { dx, dy } = toLocalDelta(t.clientX - sx, t.clientY - sy);
    lastDx = dx;
    lastDy = dy;

    if (!mode) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.25) {
        mode = "h";
      } else if (dy > 0 && stage.scrollTop <= 0) {
        mode = "ptr";
        ptrWrap.classList.add("dragging");
      } else {
        mode = "v";
        return;
      }
    }

    if (mode === "h") {
      e.preventDefault();
      const idx = TAB_ORDER.indexOf(CURRENT_TAB);
      const atEdge = (idx === 0 && dx > 0) || (idx === TAB_ORDER.length - 1 && dx < 0);
      const damped = atEdge ? dx * 0.16 : Math.max(-72, Math.min(72, dx * 0.42));
      const activePanel = document.querySelector(".view-panel.active");
      if (activePanel) {
        activePanel.style.transition = "none";
        activePanel.style.transform = `translateX(${damped.toFixed(1)}px)`;
      }
    } else if (mode === "ptr") {
      if (dy <= 0) return;
      e.preventDefault();
      const pull = Math.min(60, dy * 0.48);
      const pct = Math.min(100, Math.round((pull / 48) * 100));
      ptrWrap.style.height = `${pull.toFixed(0)}px`;
      ptrWrap.style.opacity = `${Math.min(1, pull / 32).toFixed(2)}`;
      ptrArc.setAttribute("stroke-dasharray", `${pct} 100`);
      ptrLbl.textContent = pull >= 48 ? "松手立即同步" : "下拉同步";
    }
  }, { passive: false });

  async function finishGesture() {
    if (!tracking) return;
    tracking = false;

    if (mode === "h") {
      const dt = Date.now() - t0;
      const idx = TAB_ORDER.indexOf(CURRENT_TAB);
      const swipeRight = lastDx > 54 || (lastDx > 28 && dt < 220);
      const swipeLeft = lastDx < -54 || (lastDx < -28 && dt < 220);
      if (swipeLeft && idx < TAB_ORDER.length - 1) {
        switchTab(TAB_ORDER[idx + 1], 1);
      } else if (swipeRight && idx > 0) {
        switchTab(TAB_ORDER[idx - 1], -1);
      } else {
        const activePanel = document.querySelector(".view-panel.active");
        if (activePanel) {
          activePanel.style.transition = "transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)";
          activePanel.style.transform = "translateX(0)";
          setTimeout(() => { activePanel.style.transition = ""; activePanel.style.transform = ""; }, 230);
        }
      }
    } else if (mode === "ptr") {
      ptrWrap.classList.remove("dragging");
      const pull = Math.min(60, Math.max(0, lastDy * 0.48));
      if (pull >= 48 && !ptrBusy) {
        ptrBusy = true;
        ptrWrap.classList.add("syncing");
        ptrWrap.style.height = "42px";
        ptrWrap.style.opacity = "1";
        ptrArc.setAttribute("stroke-dasharray", "68 100");
        ptrLbl.textContent = "同步中…";
        await pullFromCloud(false);
        setTimeout(() => {
          ptrWrap.classList.remove("syncing");
          ptrWrap.style.height = "0px";
          ptrWrap.style.opacity = "0";
          ptrBusy = false;
        }, 280);
      } else {
        ptrWrap.style.height = "0px";
        ptrWrap.style.opacity = "0";
      }
    }
    mode = "";
  }

  stage.addEventListener("touchend", finishGesture, { passive: true });
  stage.addEventListener("touchcancel", finishGesture, { passive: true });
})();

/* ===================== 8. INTERACTIVE BODY CHART SCRUBBING ===================== */
(function bindChartScrub() {
  const wrap = document.getElementById("body-chart-wrap");
  if (!wrap) return;
  let active = false;

  function scrubAtClientPos(clientX, clientY) {
    if (!CHART_PTS.length) return;
    const svg = document.getElementById("body-chart-svg");
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;

    let ratio = 0;
    if (FP_ANGLE === 90) {
      ratio = (rect.bottom - clientY) / rect.height;
    } else if (FP_ANGLE === 270) {
      ratio = (clientY - rect.top) / rect.height;
    } else {
      ratio = (clientX - rect.left) / rect.width;
    }
    const svgX = Math.max(0, Math.min(360, ratio * 360));

    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < CHART_PTS.length; i++) {
      const dist = Math.abs(CHART_PTS[i].x - svgX);
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    }

    if (bestIdx === CHART_SCRUB_IDX) return;
    CHART_SCRUB_IDX = bestIdx;
    const pt = CHART_PTS[bestIdx];

    const cursor = document.getElementById("chart-cursor");
    const halo = document.getElementById("chart-halo");
    const focus = document.getElementById("chart-focus");
    if (cursor && halo && focus) {
      cursor.setAttribute("x1", pt.x);
      cursor.setAttribute("x2", pt.x);
      cursor.style.display = "";
      halo.setAttribute("cx", pt.x);
      halo.setAttribute("cy", pt.y);
      halo.style.display = "";
      focus.setAttribute("cx", pt.x);
      focus.setAttribute("cy", pt.y);
      focus.style.display = "";
    }
    applyBodyHeadline(getFitnessDate(), getLatestBodyMetrics(), pt);
  }

  function endScrub() {
    if (!active && CHART_SCRUB_IDX === -1) return;
    active = false;
    CHART_SCRUB_IDX = -1;
    const cursor = document.getElementById("chart-cursor");
    const halo = document.getElementById("chart-halo");
    const focus = document.getElementById("chart-focus");
    if (cursor) cursor.style.display = "none";
    if (halo) halo.style.display = "none";
    if (focus) focus.style.display = "none";
    applyBodyHeadline(getFitnessDate(), getLatestBodyMetrics(), null);
  }

  wrap.addEventListener("pointerdown", (e) => {
    if (!CHART_PTS.length) return;
    active = true;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    scrubAtClientPos(e.clientX, e.clientY);
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!active && e.pointerType !== "mouse") return;
    if (!active && e.buttons === 0) return;
    scrubAtClientPos(e.clientX, e.clientY);
  });
  wrap.addEventListener("pointerup", endScrub);
  wrap.addEventListener("pointercancel", endScrub);
  wrap.addEventListener("pointerleave", () => { if (!active) endScrub(); });
})();

/* ===================== 9. ZERO-KEYBOARD TACTILE WEIGH-IN DIAL ===================== */
function renderDialValues() {
  const wtSlot = document.getElementById("dial-wt-slot");
  const bfSlot = document.getElementById("dial-bf-slot");
  if (wtSlot && !wtSlot.querySelector("input")) {
    wtSlot.innerHTML = `<button class="dial-val-btn" id="dial-wt-val" onclick="editDialInline('wt')">${DIAL_WT.toFixed(1)}</button>`;
  }
  if (bfSlot && !bfSlot.querySelector("input")) {
    bfSlot.innerHTML = `<button class="dial-val-btn" id="dial-bf-val" onclick="editDialInline('bf')" style="${DIAL_SKIP_BF ? "opacity:0.35;" : ""}">${DIAL_SKIP_BF ? "--" : DIAL_BF.toFixed(1)}</button>`;
  }
  const tw = document.getElementById("dial-ticks-wt");
  const tb = document.getElementById("dial-ticks-bf");
  if (tw) tw.style.backgroundPosition = `${DIAL_WT_OFFSET.toFixed(1)}px 0`;
  if (tb) tb.style.backgroundPosition = `${DIAL_BF_OFFSET.toFixed(1)}px 0`;
  const skipBtn = document.getElementById("dial-bf-skip-btn");
  if (skipBtn) {
    skipBtn.textContent = DIAL_SKIP_BF ? "改为同时记体脂" : "仅记体重";
    skipBtn.className = `btn-quiet ${DIAL_SKIP_BF ? "is-active-moss" : ""}`;
  }
}

function nudgeDial(which, delta) {
  if (which === "wt") {
    DIAL_WT = Math.max(45, Math.min(120, +(DIAL_WT + delta).toFixed(1)));
    DIAL_WT_OFFSET -= delta * 100;
  } else {
    DIAL_SKIP_BF = false;
    DIAL_BF = Math.max(6, Math.min(40, +(DIAL_BF + delta).toFixed(1)));
    DIAL_BF_OFFSET -= delta * 100;
  }
  renderDialValues();
}

function toggleSkipBf() {
  DIAL_SKIP_BF = !DIAL_SKIP_BF;
  renderDialValues();
}

function editDialInline(which) {
  const slot = document.getElementById(which === "wt" ? "dial-wt-slot" : "dial-bf-slot");
  if (!slot) return;
  const cur = which === "wt" ? DIAL_WT.toFixed(1) : DIAL_BF.toFixed(1);
  slot.innerHTML = `<input class="dial-inline-input" type="number" step="0.1" inputmode="decimal" value="${cur}" />`;
  const inp = slot.querySelector("input");
  inp.focus();
  inp.select();
  const commit = () => {
    const v = parseFloat(inp.value);
    if (!isNaN(v)) {
      if (which === "wt" && v >= 45 && v <= 120) DIAL_WT = +v.toFixed(1);
      if (which === "bf" && v >= 6 && v <= 40) { DIAL_BF = +v.toFixed(1); DIAL_SKIP_BF = false; }
    }
    slot.innerHTML = "";
    renderDialValues();
  };
  inp.addEventListener("blur", commit);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
}

(function bindDialTracks() {
  const pairs = [
    { id: "dial-track-wt", key: "wt", min: 45, max: 120, pxPerStep: 11 },
    { id: "dial-track-bf", key: "bf", min: 6, max: 40, pxPerStep: 13 }
  ];
  for (const cfg of pairs) {
    const el = document.getElementById(cfg.id);
    if (!el) continue;
    let dragging = false;
    let startPos = 0;
    let startVal = 0;
    let startOff = 0;

    el.addEventListener("pointerdown", (e) => {
      dragging = true;
      startPos = FP_ANGLE === 90 ? -e.clientY : (FP_ANGLE === 270 ? e.clientY : e.clientX);
      startVal = cfg.key === "wt" ? DIAL_WT : DIAL_BF;
      startOff = cfg.key === "wt" ? DIAL_WT_OFFSET : DIAL_BF_OFFSET;
      if (cfg.key === "bf") DIAL_SKIP_BF = false;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const curPos = FP_ANGLE === 90 ? -e.clientY : (FP_ANGLE === 270 ? e.clientY : e.clientX);
      const dx = curPos - startPos;
      // Dragging left increases value (like rolling a physical ruler), right decreases
      const steps = Math.round(-dx / cfg.pxPerStep);
      const nextVal = Math.max(cfg.min, Math.min(cfg.max, +(startVal + steps * 0.1).toFixed(1)));
      if (cfg.key === "wt") {
        DIAL_WT = nextVal;
        DIAL_WT_OFFSET = startOff + dx;
      } else {
        DIAL_BF = nextVal;
        DIAL_BF_OFFSET = startOff + dx;
      }
      renderDialValues();
    });
    const stop = () => { dragging = false; };
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
  }
})();

function toggleWeighForm(forceOpen) {
  const f = document.getElementById("weigh-drawer");
  const open = typeof forceOpen === "boolean" ? forceOpen : !f.classList.contains("open");
  if (open) {

}

function saveDialWeigh() {
  const wtVal = +DIAL_WT.toFixed(1);
  const bf = DIAL_SKIP_BF ? null : +DIAL_BF.toFixed(1);
  const today = getFitnessDate();
  const d = ensureDay(today);
  d.wt = wtVal;
  if (bf !== null) d.bf = bf;

  if (!Array.isArray(STATE.wb)) STATE.wb = [];
  const idx = STATE.wb.findIndex(r => r[0] === today);
  const row = [today, wtVal, bf, "phone"];
  if (idx >= 0) STATE.wb[idx] = row;
  else STATE.wb.push(row);
  STATE.wb.sort((a, b) => a[0].localeCompare(b[0]));

  toggleWeighForm(false);
  schedulePush();
  renderAll();
  showToast(bf !== null ? `已记 ${wtVal.toFixed(1)} kg · GE ${bf.toFixed(1)}%` : `已记体重 ${wtVal.toFixed(1)} kg`);
}

/* ===================== 10. PULL-UP 4-SECOND ECCENTRIC PACER ===================== */
function playZenChime(freq = 528) {
  if (!PACER_SOUND) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AUDIO_CTX) AUDIO_CTX = new Ctx();
    if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume();
    const now = AUDIO_CTX.currentTime;
    const osc = AUDIO_CTX.createOscillator();
    const gain = AUDIO_CTX.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.09, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);
    osc.connect(gain);
    gain.connect(AUDIO_CTX.destination);
    osc.start(now);
    osc.stop(now + 0.38);
  } catch (e) {}
}

async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator && !PACER_WAKE_LOCK) {
      PACER_WAKE_LOCK = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}

function releaseWakeLock() {
  try {
    if (PACER_WAKE_LOCK) {
      PACER_WAKE_LOCK.release().catch(() => {});
      PACER_WAKE_LOCK = null;
    }
  } catch (e) {}
}

function togglePacerSound() {
  PACER_SOUND = !PACER_SOUND;
  const btn = document.getElementById("pacer-sound-btn");
  if (btn) {
    btn.textContent = PACER_SOUND ? "轻音：开" : "轻音：关";
    btn.className = `btn-quiet ${PACER_SOUND ? "is-active-moss" : ""}`;
  }
  if (PACER_SOUND) playZenChime(528);
}

function togglePacer() {
  if (PACER_ACTIVE) {
    stopPacer(true);
    return;
  }
  const today = getFitnessDate();
  const rounds = (getDayEntry(today).pu || []).length;
  if (rounds >= 2) {
    showToast("今天 2 轮已满额，明天继续更长劲");
    return;
  }
  startPacer();
}

function startPacer() {
  PACER_ACTIVE = true;
  document.getElementById("pacer-box").classList.add("open");
  const pacerBtn = document.getElementById("pu-pacer-btn");
  pacerBtn.textContent = "节拍进行中";
  pacerBtn.className = "btn-quiet is-active-moss";
  acquireWakeLock();

  const totalReps = Math.max(1, 3 - PU_STRICT_INPUT);
  const steps = [{ kind: "prep", dur: 3000, label: "准备抓杠 · 顶住下巴" }];
  for (let i = 1; i <= totalReps; i++) {
    steps.push({ kind: "down", dur: 4000, label: `匀速慢放 · 第 ${i} / ${totalReps} 次` });
    if (i < totalReps) {
      steps.push({ kind: "rest", dur: 4000, label: "轻落换气 · 准备下一次" });
    }
  }

  let stepIdx = 0;
  let stepStart = performance.now();
  let lastChimeStep = -1;

  const arcEl = document.getElementById("pacer-arc");
  const numEl = document.getElementById("pacer-num");
  const phaseEl = document.getElementById("pacer-phase");

  function frame(now) {
    if (!PACER_ACTIVE) return;
    const cur = steps[stepIdx];
    if (lastChimeStep !== stepIdx) {
      lastChimeStep = stepIdx;
      playZenChime(cur.kind === "down" ? 440 : 528);
    }
    const elapsed = now - stepStart;
    const ratio = Math.min(1, elapsed / cur.dur);
    const remSec = Math.max(0, (cur.dur - elapsed) / 1000);

    phaseEl.textContent = cur.label;
    if (cur.kind === "down") {
      // Smoothly contract ring 100 -> 0 over 4.0 seconds
      const pct = Math.max(0, (1 - ratio) * 100);
      arcEl.setAttribute("stroke", "var(--moss)");
      arcEl.setAttribute("stroke-dasharray", `${pct.toFixed(1)} 100`);
      numEl.textContent = Math.max(1, Math.ceil(remSec));
    } else if (cur.kind === "prep") {
      const pct = ratio * 100;
      arcEl.setAttribute("stroke", "var(--ochre)");
      arcEl.setAttribute("stroke-dasharray", `${pct.toFixed(1)} 100`);
      numEl.textContent = Math.max(1, Math.ceil(remSec));
    } else {
      const pct = ratio * 100;
      arcEl.setAttribute("stroke", "var(--ink-3)");
      arcEl.setAttribute("stroke-dasharray", `${pct.toFixed(1)} 100`);
      numEl.textContent = Math.max(1, Math.ceil(remSec));
    }

    if (elapsed >= cur.dur) {
      stepIdx++;
      if (stepIdx >= steps.length) {
        playZenChime(660);
        arcEl.setAttribute("stroke", "var(--moss)");
        arcEl.setAttribute("stroke-dasharray", "100 100");
        numEl.textContent = "✓";
        phaseEl.textContent = "慢放完成，已记入本轮";
        PACER_ACTIVE = false;
        releaseWakeLock();
        logPullupRound();
        setTimeout(() => {
          const box = document.getElementById("pacer-box");
          if (box && !PACER_ACTIVE) box.classList.remove("open");
        }, 1200);
        return;
      }
      stepStart = now;
    }
    PACER_RAF = requestAnimationFrame(frame);
  }

  PACER_RAF = requestAnimationFrame(frame);
}

function stopPacer(withToast) {
  PACER_ACTIVE = false;
  if (PACER_RAF) {
    cancelAnimationFrame(PACER_RAF);
    PACER_RAF = null;
  }
  releaseWakeLock();
  const box = document.getElementById("pacer-box");
  if (box) box.classList.remove("open");
  const pacerBtn = document.getElementById("pu-pacer-btn");
  if (pacerBtn) {
    pacerBtn.textContent = "4 秒慢放节拍";
    pacerBtn.className = "btn-quiet";
  }
  if (withToast) showToast("已停止慢放节拍");
}

/* ===================== 11. CORE INTERACTIONS & LEDGER EDITING ===================== */
function ensureDay(ymd) {
  if (!STATE.days) STATE.days = {};
  if (!STATE.days[ymd]) STATE.days[ymd] = { ts: 0, pu: [], diet: 0 };
  STATE.days[ymd].ts = Math.floor(Date.now() / 1000);
  return STATE.days[ymd];
}

function setPeloMin(m) {
  SELECTED_PELO_MIN = m;
  renderAll();
}

function markPeloton(status) {
  const d = ensureDay(getFitnessDate());
  if (d.pelo === status) {
    d.pelo = null;
    d.pelo_min = 0;
    showToast("已取消本次打卡");
  } else {
    d.pelo = status;
    d.pelo_min = status === "done" ? SELECTED_PELO_MIN : (status === "recovery" ? 15 : 0);
    showToast(status === "done" ? `Peloton ${d.pelo_min} 分钟已记` : (status === "recovery" ? "恢复骑已记" : "今日休整已确认"));
  }
  schedulePush();
  renderAll();
}

function toggleBasketball(level) {
  const d = ensureDay(getFitnessDate());
  if (d.bb === level) {
    d.bb = null;
    showToast("已恢复默认排课");
  } else {
    d.bb = level;
    showToast(level === "high" ? "已切换红档 · 今晚 Peloton 取消高强度" : "已切换黄档 · 今晚降档恢复骑");
  }
  schedulePush();
  renderAll();
}

function quickPullupTap(roundNum) {
  const d = ensureDay(getFitnessDate());
  if (!Array.isArray(d.pu)) d.pu = [];
  const stg = getPullupStage();
  const nowSec = Math.floor(Date.now() / 1000);
  if (d.pu.length >= roundNum) {
    d.pu = d.pu.slice(0, roundNum - 1);
    showToast(`已撤销第 ${roundNum} 轮`);
  } else {
    while (d.pu.length < roundNum) {
      d.pu.push([stg.defaultStrict, stg.negReps, nowSec]);
    }
    showToast(roundNum === 1 ? "第 1 轮已记 · 2 小时后再拉第 2 轮" : "第 2 轮已记 · 今日引体收工");
  }
  schedulePush();
  renderAll();
}

function adjStrict(delta) {
  PU_STRICT_INPUT = Math.max(0, Math.min(10, PU_STRICT_INPUT + delta));
  renderAll();
}

function logPullupRound() {
  const d = ensureDay(getFitnessDate());
  if (!Array.isArray(d.pu)) d.pu = [];
  if (d.pu.length >= 2) {
    showToast("今天 2 轮已满额，明天继续更长劲");
    return;
  }
  const neg = Math.max(0, 3 - PU_STRICT_INPUT);
  d.pu.push([PU_STRICT_INPUT, neg, Math.floor(Date.now() / 1000)]);
  if (PU_STRICT_INPUT > (STATE.pu_best || 1)) {
    STATE.pu_best = PU_STRICT_INPUT;
    showToast(`新纪录！标准不甩 ${PU_STRICT_INPUT} 个`);
  } else {
    showToast(d.pu.length === 1 ? "第 1 轮已记 · 2 小时后再拉第 2 轮" : "第 2 轮已记 · 今日引体收工");
  }
  schedulePush();
  renderAll();
}

function undoPullupRound() {
  const d = ensureDay(getFitnessDate());
  if (Array.isArray(d.pu) && d.pu.length > 0) {
    d.pu.pop();
    schedulePush();
    renderAll();
    showToast("已撤销上一轮");
  }
}

function toggleDiet() {
  const d = ensureDay(getFitnessDate());
  d.diet = d.diet ? 0 : 1;
  schedulePush();
  renderAll();
  showToast(d.diet ? "今日饮食节律已打卡" : "已取消");
}

function setChartMetric(m) {
  CHART_METRIC = m;
  renderAll();
}
function setChartRange(r) {
  CHART_RANGE = r;
  renderAll();
}

function toggleLedgerDay(ymd) {
  EXPANDED_LEDGER_DATE = EXPANDED_LEDGER_DATE === ymd ? null : ymd;
  renderAll();
}

function editLedgerCardio(ymd, field, val) {
  const d = ensureDay(ymd);
  if (field === "clear") {
    d.pelo = null;
    d.pelo_min = 0;
    d.bb = null;
    showToast(`${ymd.slice(5)} 心肺记录已清空`);
  } else if (field === "pelo") {
    d.pelo = d.pelo === val ? null : val;
    d.pelo_min = d.pelo === "done" ? 40 : (d.pelo === "recovery" ? 20 : 0);
    showToast(`${ymd.slice(5)} 已更新`);
  } else if (field === "bb") {
    d.bb = d.bb === val ? null : val;
    showToast(`${ymd.slice(5)} 篮球记录已更新`);
  }
  schedulePush();
  renderAll();
}

function editLedgerPullup(ymd, rounds) {
  const d = ensureDay(ymd);
  const stg = getPullupStage();
  d.pu = [];
  for (let i = 0; i < rounds; i++) {
    d.pu.push([stg.defaultStrict, stg.negReps]);
  }
  schedulePush();
  renderAll();
  showToast(`${ymd.slice(5)} 引体已改为 ${rounds} 轮`);
}

function editLedgerDiet(ymd) {
  const d = ensureDay(ymd);
  d.diet = d.diet ? 0 : 1;
  schedulePush();
  renderAll();
  showToast(d.diet ? `${ymd.slice(5)} 饮食达标已补记` : `${ymd.slice(5)} 已取消饮食打卡`);
}

function forcePullCloud() {
  pullFromCloud(false);
}

let TOAST_TIMER = null;
function showToast(msg) {
  const el = document.getElementById("zen-toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => el.classList.remove("show"), 2300);
}

/* ===================== 12. QUICK SHORTCUT LAUNCH HANDLER ===================== */
function handleQuickAction() {
  const params = new URLSearchParams(window.location.search || "");
  const quick = params.get("quick");
  if (!quick) return;

  // Strip ?quick=... while preserving #t=...&k=... hash intact for A2HS!
  try {
    history.replaceState(null, "", window.location.pathname + window.location.hash);
  } catch (e) {}

  if (quick === "pullup1") {
    const today = getFitnessDate();
    const cur = (getDayEntry(today).pu || []).length;
    if (cur < 2) quickPullupTap(cur + 1);
    else showToast("今天 2 轮引体已满额");
  } else if (quick === "bb_high") {
    const d = ensureDay(getFitnessDate());
    d.bb = "high";
    schedulePush();
    renderAll();
    showToast("已切换红档 · 今晚 Peloton 取消高强度");
  } else if (quick === "weigh") {
    switchTab("body");
    toggleWeighForm(true);
  }
}

/* ===================== 13. BOOTSTRAP ===================== */
async function boot() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const unlocked = await initVault();
  if (!unlocked) {
    document.getElementById("locked-view").style.display = "flex";
    return;
  }
  document.getElementById("main-app").style.display = "flex";
  APP_READY = true;
  loadLocalState();
  syncPullupInputDefault();
  renderAll();
  positionNavBars(true);

  handleQuickAction();

  await pullFromCloud(true);
  positionNavBars(true);

  try {
    if (localStorage.getItem(PENDING_PUSH_KEY)) await pushToCloudNow();
  } catch (e) {}

  // Keep dynamic manifest color synced if phone toggles Dark/Light mode
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", () => { if (VAULT) updateDynamicManifest(VAULT); });
  }

  // Auto refresh when returning to phone app or after 04:00 AM PT date rollover
  let lastRenderedDay = getFitnessDate();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && PACER_ACTIVE) {
      releaseWakeLock();
    } else if (document.visibilityState === "visible") {
      if (PACER_ACTIVE) acquireWakeLock();
      const curDay = getFitnessDate();
      if (curDay !== lastRenderedDay) {
        lastRenderedDay = curDay;
        renderAll();
      }
      pullFromCloud(true);
    }
  });
  setInterval(() => {
    const curDay = getFitnessDate();
    if (curDay !== lastRenderedDay) {
      lastRenderedDay = curDay;
      renderAll();
    }
  }, 60000);
}

boot();
</script>
